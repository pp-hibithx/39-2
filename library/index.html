<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIBRARY | 39*2</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
.album-grid{display:grid;grid-template-columns:370px minmax(0,1fr);gap:14px;align-items:start}
.album-panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px}
.album-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.album-list{display:grid;gap:12px;margin-top:10px}
.album-card{border:1px solid var(--line);border-radius:11px;overflow:hidden}.album-cover{min-height:74px;padding:15px;background:rgba(255,255,255,.025)}
.album-body{padding:12px}.album-meta{display:flex;gap:5px;flex-wrap:wrap}.album-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.spoiler{margin-top:9px;border:1px solid var(--line);border-radius:8px;overflow:hidden}.spoiler summary{cursor:pointer;padding:8px 10px;font-weight:700}.spoiler-body{padding:0 10px 10px;white-space:pre-wrap}
textarea{width:100%;min-height:76px}input,select{width:100%}label{display:block;margin:7px 0 3px}
@media(max-width:850px){.album-grid{grid-template-columns:1fr}.album-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="site-header"><div class="wrap">
<h1 class="brand brand-392">39*2 <span class="hibiscus-logo" aria-hidden="true">🌺</span></h1>
<div class="tagline">TRPG Scenario &amp; Tools</div>
<nav class="nav"><a href="../">HOME</a><a href="../scenario/">SCENARIO</a><a href="../library/" aria-current="page">LIBRARY</a><a href="../tools/">TOOLS</a><a href="../backup/">BACKUP</a><a href="../about/">ABOUT</a></nav>
</div></header>
<main><div class="wrap">
<div class="hero"><h2>LIBRARY</h2><p>友達と遊んだTRPGの記録を、<br>アルバムとして残せます。</p></div>
<div class="notice small">記録は、お使いのブラウザ内に保存されます。<br>現在、他の利用者とのオンライン共有には対応していません。</div>
<div class="album-grid">
<section class="album-panel">
<h2 id="formHeading">卓の記録を追加</h2><input id="editId" type="hidden">
<label>シナリオ名</label><input id="title">
<div class="album-row"><div><label>遊んだ日</label><input id="date" type="date"></div><div><label>システム</label><input id="system" placeholder="CoC6版 など"></div></div>
<div class="album-row"><div><label>自分の役割</label><select id="role"><option>PL</option><option>KP</option><option>SKP</option><option>その他</option></select></div><div><label>PC名</label><input id="pc"></div></div>
<label>一緒に遊んだ人</label><input id="people" placeholder="名前をカンマ区切り">
<label>スクリーンショットURL</label><input id="image" type="url" placeholder="https://...">
<label>公開範囲</label><select id="visibility"><option value="private">自分のみ</option><option value="table">同卓者のみ</option><option value="link">リンク限定</option><option value="public">公開</option></select>
<label>ひとこと</label><textarea id="comment" placeholder="楽しかった！ など、ネタバレなしの思い出"></textarea>
<label>⚠ ネタバレ枠</label><textarea id="spoiler" placeholder="シナリオ内容に触れる感想はこちら"></textarea>
<div class="album-actions"><button id="save" class="primary" type="button">アルバムに残す</button><button id="cancel" type="button" hidden>編集をやめる</button></div>
</section>
<section class="album-panel">
<div><h2>TRPG ALBUM</h2><div id="summary" class="small"></div></div>
<div class="album-row"><div><label>検索</label><input id="search" type="search" placeholder="シナリオ・PC・友達"></div><div><label>役割</label><select id="filter"><option value="">すべて</option><option>PL</option><option>KP</option><option>SKP</option><option>その他</option></select></div></div>
<div id="list" class="album-list"></div>
</section>
</div>
</div></main>
<footer class="footer"><div class="wrap">© <span data-year></span> 39*2</div></footer>
<script src="../assets/js/main.js"></script>
<script>
(()=>{"use strict";
const KEY="39x2_album_v1",q=id=>document.getElementById(id),vis={private:"自分のみ",table:"同卓者のみ",link:"リンク限定",public:"公開"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let data=(()=>{try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch{return[]}})();const persist=()=>localStorage.setItem(KEY,JSON.stringify(data));
function reset(){q("editId").value="";["title","date","system","pc","people","image","comment","spoiler"].forEach(x=>q(x).value="");q("role").value="PL";q("visibility").value="private";q("formHeading").textContent="卓の記録を追加";q("cancel").hidden=true}
function save(){let title=q("title").value.trim();if(!title)return alert("シナリオ名を入力してください。");let id=q("editId").value||Date.now().toString(36)+Math.random().toString(36).slice(2,6),item={id,title,date:q("date").value,system:q("system").value.trim(),role:q("role").value,pc:q("pc").value.trim(),people:q("people").value.split(",").map(x=>x.trim()).filter(Boolean),image:q("image").value.trim(),visibility:q("visibility").value,comment:q("comment").value.trim(),spoiler:q("spoiler").value.trim(),updatedAt:Date.now()};let i=data.findIndex(x=>x.id===id);if(i>=0)data[i]=item;else data.unshift(item);persist();reset();render()}
function edit(id){let x=data.find(v=>v.id===id);if(!x)return;Object.entries({editId:x.id,title:x.title,date:x.date,system:x.system,role:x.role,pc:x.pc,people:(x.people||[]).join(", "),image:x.image,visibility:x.visibility,comment:x.comment,spoiler:x.spoiler}).forEach(([k,v])=>q(k).value=v||"");q("formHeading").textContent="卓の記録を編集";q("cancel").hidden=false;scrollTo({top:0,behavior:"smooth"})}
function del(id){if(confirm("この卓の記録を削除しますか？")){data=data.filter(x=>x.id!==id);persist();render()}}
function render(){let term=q("search").value.trim().toLowerCase(),role=q("filter").value;let xs=data.filter(x=>(!role||x.role===role)&&(!term||[x.title,x.system,x.pc,(x.people||[]).join(" ")].join(" ").toLowerCase().includes(term)));q("summary").textContent=`記録 ${data.length}件 ／ 表示 ${xs.length}件`;q("list").innerHTML=xs.length?xs.map(x=>`<article class="album-card">${x.image?`<div class="album-cover"><img src="${esc(x.image)}" alt="" style="max-width:100%;max-height:260px;border-radius:7px"></div>`:""}<div class="album-body"><h3>${esc(x.title)}</h3><div class="album-meta">${x.date?`<span class="badge">${esc(x.date)}</span>`:""}${x.system?`<span class="badge">${esc(x.system)}</span>`:""}<span class="badge">${esc(x.role)}</span><span class="badge">🔒 ${esc(vis[x.visibility]||"自分のみ")}</span></div>${x.pc?`<p class="small">PC：${esc(x.pc)}</p>`:""}${(x.people||[]).length?`<p class="small">一緒に遊んだ人：${esc(x.people.join(" / "))}</p>`:""}${x.comment?`<p>${esc(x.comment)}</p>`:""}${x.spoiler?`<details class="spoiler"><summary>⚠ ネタバレを表示</summary><div class="spoiler-body">${esc(x.spoiler)}</div></details>`:""}<div class="album-actions"><button data-edit="${x.id}">編集</button><button class="danger" data-del="${x.id}">削除</button></div></div></article>`).join(""):'<div class="empty">まだアルバムに記録がありません。</div>';document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>del(b.dataset.del))}
q("save").onclick=save;q("cancel").onclick=reset;q("search").oninput=render;q("filter").onchange=render;render();
})();
</script>
</body></html>
