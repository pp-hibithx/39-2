<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>39*2</title><link rel="stylesheet" href="../assets/css/style.css?v=0219">
<style>
.share-page{display:grid;gap:14px}
.share-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.share-meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.share-list{display:grid;gap:8px}
.share-row{border-top:1px solid rgba(255,255,255,.07);padding-top:8px}
.share-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10)}
.share-day{min-height:68px;background:var(--panel);padding:6px;font-size:12px}
.share-day .num{color:var(--muted);font-size:11px}
.free{margin-top:6px;font-weight:700}
.busy{margin-top:6px;color:var(--muted)}
@media(max-width:760px){.share-cal{font-size:11px}.share-day{min-height:54px;padding:4px}}
</style>
</head>
<body>
<header class="site-header"><div class="wrap"><h1 class="brand brand-392">39*2 <span class="hibiscus-logo" aria-hidden="true">🌺</span></h1><div class="tagline">TRPG Scenario &amp; Tools</div><nav class="nav"><a href="./" aria-current="page">HOME</a><a href="./scenario/">SCENARIO</a><a href="./calendar/">CALENDAR</a><a href="./library/">LIBRARY</a><a href="./tools/">TOOLS</a><a href="./backup/">BACKUP</a><a href="./about/">ABOUT</a></nav></div></header>
<main><div class="wrap share-page">
  <div class="hero"><h2>SHARED</h2><p>39*2で共有されたページです。</p></div>
  <div id="shareContent" class="share-card"><p>読み込み中...</p></div>
</div></main>
<footer class="footer"><div class="wrap">© <span data-year></span> 39*2</div></footer>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/supabase-config.js?v=0210"></script>
<script src="../assets/js/supabase-share.js?v=0219"></script>
<script>
(async()=>{
 const box=document.getElementById("shareContent");
 const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 const id=new URLSearchParams(location.search).get("id")||location.hash.replace(/^#/,"");
 if(!id){box.innerHTML="<p>共有IDがありません。</p>";return;}
 try{
   const payload=await TRPG39Cloud.getSharedPage(id);
   if(!payload)throw new Error("共有データが見つかりません");
   if(payload.kind==="library-session"){
     box.innerHTML=`<h2>${esc(payload.title||"LIBRARY")}</h2>
       <div class="share-meta">${payload.system?`<span class="badge">${esc(payload.system)}</span>`:""}${payload.role?`<span class="badge">${esc(payload.role)}</span>`:""}${payload.date?`<span class="badge">${esc(payload.date)}</span>`:""}</div>
       ${payload.image?`<img src="${esc(payload.image)}" alt="" style="max-width:420px;width:100%;border-radius:8px;border:1px solid var(--line);margin-bottom:10px">`:""}
       ${payload.pcName?`<p><strong>PC</strong>　${esc(payload.pcName)}</p>`:""}
       ${(payload.participants||[]).length?`<p><strong>参加者</strong>　${esc(payload.participants.join(" / "))}</p>`:""}
       ${payload.comment?`<p style="white-space:pre-wrap">${esc(payload.comment)}</p>`:""}
       ${payload.spoiler?`<details class="spoiler"><summary>⚠ ネタバレ</summary><div class="spoiler-body">${esc(payload.spoiler)}</div></details>`:""}`;
   } else if(payload.kind==="calendar-availability"){
     const days=payload.days||[];
     box.innerHTML=`<h2>${esc(payload.label||"空き日カレンダー")}</h2>
       <p class="small">共有されているのは空き状況だけです。予定の内容は表示されません。</p>
       <div class="share-cal">${days.map(d=>`<div class="share-day"><div class="num">${esc(d.date)}</div><div class="${d.state==="free"?"free":"busy"}">${d.state==="free"?"○ 空き":"予定あり"}</div></div>`).join("")}</div>`;
   } else {
     box.innerHTML="<p>この共有データ形式には対応していません。</p>";
   }
 }catch(e){console.error(e);box.innerHTML=`<p>共有ページを読み込めませんでした。<br><span class="small">${esc(e.message||e)}</span></p>`}
})();
</script>
</body></html>
