<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ダイスログ抽出 | TRPGTHX</title>
<link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
<header class="site-header"><div class="wrap">
<h1 class="brand">TRPGTHX</h1><div class="tagline">TRPG Scenario & Tools</div>
<nav class="nav"><a href="../../">HOME</a><a href="../../scenario/">SCENARIO</a><a href="../" aria-current="page">TOOLS</a><a href="../../about/">ABOUT</a></nav>
</div></header>

<main><div class="wrap">
<div class="hero">
  <h2>ダイスログ抽出</h2>
  <p>セッションログから、選んだキャラクターの技能を抜き出します。</p>
</div>

<section><div class="note">ログは外部へ送信しません。解析はこのブラウザ内だけで行います。</div></section>

<section class="toolbox">
  <div class="tool-panel">
    <h3>1. ログを読み込む</h3>
    <div class="field">
      <label for="logFile">HTML / TXTファイル</label>
      <input id="logFile" type="file" accept=".html,.htm,.txt,text/html,text/plain">
    </div>
    <div class="or">または</div>
    <div class="field">
      <label for="logText">ログを貼り付け</label>
      <textarea id="logText" placeholder="ココフォリアのログをここに貼り付けても使えます。"></textarea>
    </div>
    <div class="button-row"><button id="analyze" class="primary">ログを解析</button><button id="clear">クリア</button></div>
    <div id="loadStatus" class="muted small"></div>
  </div>

  <div id="characterPanel" class="tool-panel" hidden>
    <h3>2. キャラクターを選ぶ</h3>
    <div class="subrow"><button id="selectAll" class="compact">全選択</button><button id="selectNone" class="compact">全解除</button></div>
    <div id="characterList" class="check-grid"></div>
  </div>

  <div id="optionPanel" class="tool-panel" hidden>
    <h3>3. 抽出条件</h3>
    <div class="option-grid">
      <label class="check-card"><input id="specialOnly" type="checkbox" checked> スペシャル以上だけ</label>
      <label class="check-card"><input id="uniqueSkills" type="checkbox" checked> 同じ技能をまとめる</label>
    </div>
    <div class="field inline-field">
      <label for="keyword">技能名フィルター</label>
      <input id="keyword" type="search" placeholder="例：心理学（空欄ならすべて）">
    </div>
  </div>

  <div id="resultPanel" class="tool-panel" hidden>
    <div class="result-head">
      <div><h3>4. 抽出結果</h3><div id="summary" class="muted small"></div></div>
      <button id="copyResult" class="compact">結果をコピー</button>
    </div>
    <pre id="result" class="result"></pre>
  </div>
</section>

<section>
  <details class="help"><summary>表示について</summary>
    <p>通常は「キャラクター名：技能名」だけを表示します。クリティカル／ファンブルが含まれる技能だけ、該当する出目も表示します。</p>
  </details>
</section>
</div></main>
<footer class="footer"><div class="wrap">© <span data-year></span> TRPGTHX</div></footer>
<script src="../../assets/js/main.js"></script>
<script src="./dice-log.js"></script>
</body></html>
