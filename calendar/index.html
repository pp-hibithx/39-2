<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CALENDAR | 39*2</title>
<link rel="stylesheet" href="../assets/css/style.css?v=0214">
<style>
.calendar-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calendar-head{font-size:.8rem;color:var(--muted);text-align:center;padding:4px}
.calendar-day{min-height:108px;border:1px solid var(--line);border-radius:9px;padding:7px;background:var(--panel)}
.calendar-day.out{opacity:.35}.calendar-day.today{outline:1px solid var(--accent)}
.daynum{font-size:.8rem;color:var(--muted);margin-bottom:5px}
.event-chip{display:block;border:1px solid var(--line);border-radius:7px;padding:5px 6px;margin:4px 0;font-size:.78rem;background:rgba(255,255,255,.025);cursor:pointer}
.event-chip.done{border-color:#557c68}.event-chip.cancelled{opacity:.5;text-decoration:line-through}
.event-form{display:grid;grid-template-columns:1fr 1fr;gap:8px}.event-form .full{grid-column:1/-1}.event-editor[hidden]{display:none}.event-editor-actions{font-size:11px}.event-editor-actions button{padding:3px 5px;font-size:11px}.event-editor-actions button+button::before{content:""}
@media(max-width:760px){.calendar-grid{gap:3px}.calendar-day{min-height:82px;padding:5px}.event-form{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="site-header"><div class="wrap">
<h1 class="brand brand-392">39*2 <span class="hibiscus-logo" aria-hidden="true">🌺</span></h1>
<div class="tagline">TRPG Scenario &amp; Tools</div>
<nav class="nav"><a href="../">HOME</a><a href="../scenario/">SCENARIO</a><a href="./" aria-current="page">CALENDAR</a><a href="../library/">LIBRARY</a><a href="../tools/">TOOLS</a><a href="../backup/">BACKUP</a><a href="../about/">ABOUT</a></nav>
</div></header>
<main><div class="wrap">
<div class="hero"><h2>CALENDAR</h2><p>卓予定と遊んだ記録を、日付から確認できます。</p></div>

<section class="panel">
<div class="calendar-toolbar">
  <div class="month-nav">
    <button id="prevMonth" type="button" aria-label="前の月">←</button>
    <strong id="monthLabel"></strong>
    <button id="nextMonth" type="button" aria-label="次の月">→</button>
    <button id="todayBtn" type="button">今月</button>
  </div>
  <button id="newEventBtn" type="button">＋ 予定を追加</button>
</div>
<div class="calendar-grid" id="weekdayHead"></div>
<div class="calendar-grid" id="calendar"></div>
</section>

<section class="panel event-editor" id="eventPanel" hidden>
<h2 id="eventHeading">卓予定を登録</h2>
<input id="eventId" type="hidden">
<div class="event-form">
<div class="full"><label>シナリオ</label><select id="scenarioSelect"><option value="">直接入力</option></select></div>
<div class="full"><label>タイトル</label><input id="eventTitle"></div>
<div><label>開始</label><input id="eventStart" type="datetime-local"></div>
<div><label>終了予定</label><input id="eventEnd" type="datetime-local"></div>
<div><label>状態</label><select id="eventStatus"><option value="planned">予定</option><option value="confirmed">確定</option><option value="done">完了</option><option value="cancelled">中止</option><option value="postponed">延期</option></select></div>
<div><label>役割</label><select id="eventRole"><option value="">未設定</option><option>PL</option><option>KP</option><option>SKP</option><option>その他</option></select></div>
<div><label>システム</label><input id="eventSystem"></div>
<div><label>PC名</label><input id="eventPc"></div>
<div class="full"><label>参加者</label><input id="eventPeople" placeholder="名前をカンマ区切り"><div class="small muted">カンマごとに個別の参加者として保存します。参加者図鑑・同卓履歴への連携用です。</div></div>
</div>
<div class="event-editor-actions">
<button id="saveEvent" type="button">保存</button>
<button id="toAlbum" type="button" hidden>LIBRARYに残す</button>
<button id="resetEvent" type="button">入力をクリア</button>
<button id="deleteEvent" class="danger" type="button" hidden>削除</button>
</div>
<div class="small" style="margin-top:8px">予定をLIBRARYへ送ると、日付・シナリオ・役割・参加者などを引き継いでアルバム記録を作成します。</div>
</section>
</div></main>
<footer class="footer"><div class="wrap">© <span data-year></span> 39*2</div></footer>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/migrate-v02.js"></script>
<script src="../assets/js/shared-data.js"></script>
<script src="../assets/js/supabase-config.js?v=0210"></script>
<script src="../assets/js/supabase-sync.js?v=0210"></script>
<script>TRPG39Sync.initAutoSync();</script>
<script>
(() => {
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let current=new Date(); current.setDate(1);

const statusLabel={planned:"予定",confirmed:"確定",done:"完了",cancelled:"中止",postponed:"延期"};
const pad=n=>String(n).padStart(2,"0");
const toLocalInput=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

function scenarios(){return TRPG39.loadScenarios()}
function events(){return TRPG39.loadEvents()}
function saveEvents(v){TRPG39.saveEvents(v)}

function fillScenarioSelect(){
 const s=scenarios();
 $("scenarioSelect").innerHTML='<option value="">直接入力</option>'+s.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join("");
}
function showEditor(){$("eventPanel").hidden=false}
function hideEditor(){$("eventPanel").hidden=true}
function resetForm(dateStr=""){
 ["eventId","eventTitle","eventEnd","eventSystem","eventPc","eventPeople"].forEach(id=>$(id).value="");
 $("scenarioSelect").value=""; $("eventStatus").value="planned"; $("eventRole").value="";
 $("eventHeading").textContent="卓予定を登録"; $("deleteEvent").hidden=true; $("toAlbum").hidden=true;
 if(dateStr){$("eventStart").value=dateStr+"T21:00"} else $("eventStart").value="";
}
function editEvent(id){
 const x=events().find(v=>v.id===id); if(!x)return;
 $("eventId").value=x.id;$("eventTitle").value=x.title;$("scenarioSelect").value=x.scenarioId||"";
 $("eventStart").value=x.start?x.start.slice(0,16):"";$("eventEnd").value=x.end?x.end.slice(0,16):"";
 $("eventStatus").value=x.status||"planned";$("eventRole").value=x.role||"";$("eventSystem").value=x.system||"";
 $("eventPc").value=x.pcName||"";$("eventPeople").value=(x.participants||[]).join(", ");
 $("eventHeading").textContent="卓予定を編集";$("deleteEvent").hidden=false;$("toAlbum").hidden=!!x.linkedAlbumId;showEditor();
 $("eventPanel").scrollIntoView({behavior:"smooth",block:"start"});
}
function renderCalendar(){
 const y=current.getFullYear(),m=current.getMonth();
 $("monthLabel").textContent=`${y}年${m+1}月`;
 $("weekdayHead").innerHTML=["日","月","火","水","木","金","土"].map(x=>`<div class="calendar-head">${x}</div>`).join("");
 const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());
 const ev=events(),today=new Date();
 let html="";
 for(let i=0;i<42;i++){
   const d=new Date(start);d.setDate(start.getDate()+i);
   const ds=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
   const dayEvents=ev.filter(x=>String(x.start||"").slice(0,10)===ds);
   html+=`<div class="calendar-day ${d.getMonth()!==m?"out":""} ${d.toDateString()===today.toDateString()?"today":""}" data-date="${ds}">
     <div class="daynum">${d.getDate()}</div>
     ${dayEvents.map(x=>`<button type="button" class="event-chip ${x.status}" data-id="${x.id}">${esc(x.title||"卓")} <span class="small">${esc(statusLabel[x.status]||"")}</span></button>`).join("")}
   </div>`;
 }
 $("calendar").innerHTML=html;
 document.querySelectorAll(".calendar-day").forEach(x=>x.ondblclick=()=>{resetForm(x.dataset.date);showEditor();$("eventPanel").scrollIntoView({behavior:"smooth"})});
 document.querySelectorAll(".event-chip").forEach(x=>x.onclick=e=>{e.stopPropagation();editEvent(x.dataset.id)});
}
$("scenarioSelect").onchange=()=>{
 const x=scenarios().find(v=>v.id===$("scenarioSelect").value);
 if(x){$("eventTitle").value=x.title||"";$("eventSystem").value=x.system||""}
};
$("saveEvent").onclick=()=>{
 const title=$("eventTitle").value.trim(),start=$("eventStart").value;
 if(!title||!start)return alert("タイトルと開始日時を入力してください。");
 let list=events(),id=$("eventId").value||TRPG39.uuid(),old=list.find(x=>x.id===id);
 const item=TRPG39.normalizeEvent({
   ...(old||{}),id,title,scenarioId:$("scenarioSelect").value,scenarioTitle:title,start,end:$("eventEnd").value,
   status:$("eventStatus").value,role:$("eventRole").value,system:$("eventSystem").value.trim(),
   pcName:$("eventPc").value.trim(),participants:$("eventPeople").value.split(",").map(x=>x.trim()).filter(Boolean)
 });
 const i=list.findIndex(x=>x.id===id); if(i>=0)list[i]=item; else list.push(item);
 saveEvents(list); resetForm(); hideEditor(); renderCalendar();
};
$("deleteEvent").onclick=()=>{
 const id=$("eventId").value;if(!id||!confirm("この卓予定を削除しますか？"))return;
 saveEvents(events().filter(x=>x.id!==id));resetForm();hideEditor();renderCalendar();
};
$("toAlbum").onclick=()=>{
 const id=$("eventId").value,x=events().find(v=>v.id===id);if(!x)return;
 let album=TRPG39.loadAlbum();
 const a=TRPG39.normalizeAlbum({
   eventId:x.id,scenarioId:x.scenarioId,title:x.title,date:String(x.start||"").slice(0,10),system:x.system,role:x.role||"PL",
   pcName:x.pcName,participants:x.participants,visibility:x.visibility
 });
 album.unshift(a);TRPG39.saveAlbum(album);
 let list=events(),i=list.findIndex(v=>v.id===x.id);if(i>=0){list[i]={...x,status:"done",linkedAlbumId:a.id,updatedAt:new Date().toISOString()};saveEvents(list)}
 alert("LIBRARYに卓記録を作成しました。");resetForm();hideEditor();renderCalendar();
};
$("prevMonth").onclick=()=>{current.setMonth(current.getMonth()-1);renderCalendar()};
$("nextMonth").onclick=()=>{current.setMonth(current.getMonth()+1);renderCalendar()};
$("todayBtn").onclick=()=>{current=new Date();current.setDate(1);renderCalendar()};
$("newEventBtn").onclick=()=>{resetForm();showEditor();$("eventPanel").scrollIntoView({behavior:"smooth"})};
$("resetEvent").onclick=()=>{resetForm();hideEditor()};
fillScenarioSelect();resetForm();hideEditor();renderCalendar();
})();
</script>
</body>
</html>
