<script>
(()=>{"use strict";
const q=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let players=TRPG39.loadPlayers(),album=TRPG39.loadAlbum();const uuid=()=>TRPG39.uuid?TRPG39.uuid():crypto.randomUUID();
function stats(name){const xs=album.filter(x=>(x.participants||[]).some(n=>n.trim()===name.trim()));const dates=xs.map(x=>x.date).filter(Boolean).sort(),m=new Map();xs.forEach(x=>{const k=x.scenarioId||x.title;if(!m.has(k))m.set(k,{title:x.title||"名称未設定",scenarioId:x.scenarioId||"",first:x.date||""});else if(x.date&&(!m.get(k).first||x.date<m.get(k).first))m.get(k).first=x.date});return {count:m.size,first:dates[0]||"",last:dates.slice(-1)[0]||"",scenarios:[...m.values()].sort((a,b)=>String(a.first||"9999").localeCompare(String(b.first||"9999")))}}
function reset(){["plId","plName","plPublicName","plMemo"].forEach(x=>q(x).value="");q("plVisibility").value="private";q("plHeading").textContent="人物を追加"}
function render(){q("plSummary").textContent=`登録 ${players.length}人`;const mode=q("plSort")?.value||"name";const rows=players.map(x=>({x,st:stats(x.name)})).sort((a,b)=>mode==="count"?(b.st.count-a.st.count)||a.x.name.localeCompare(b.x.name,"ja"):mode==="recent"?String(b.st.last||"").localeCompare(String(a.st.last||""))||a.x.name.localeCompare(b.x.name,"ja"):a.x.name.localeCompare(b.x.name,"ja"));q("plList").innerHTML=rows.length?rows.map(({x,st})=>`<details class="dir-card" ${new URLSearchParams(location.search).get("focus")===x.id?"open":""}><summary><h3 style="display:inline">${esc(x.name)}</h3><div class="dir-meta">公開名：${esc(x.publicName||x.name)}</div><div class="dir-meta">同卓 ${st.count}シナリオ${st.first?` ／ 初同卓 ${esc(st.first)}`:""}${st.last?` ／ 最終同卓 ${esc(st.last)}`:""}</div></summary><div class="scenario-history">${st.scenarios.length?st.scenarios.map(s=>`<div class="history-row"><a class="link" href="../library/index.html?player=${encodeURIComponent(x.name)}${s.scenarioId?`&scenario=${encodeURIComponent(s.scenarioId)}`:""}">${esc(s.title)}</a>${s.first?` <span class="small muted">${esc(s.first)}</span>`:""}</div>`).join(""):'<div class="small muted">同卓記録はまだありません。</div>'}<div class="dir-actions"><a class="link" href="../library/index.html?player=${encodeURIComponent(x.name)}">LIBRARYで全記録を見る</a><button data-edit="${x.id}">編集</button><button data-share="${x.id}">共有</button></div></div></details>`).join(""):'<div class="empty">まだ人物が登録されていません。</div>';document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=e=>{e.preventDefault();edit(b.dataset.edit)});document.querySelectorAll("[data-share]").forEach(b=>b.onclick=e=>{e.preventDefault();share(b.dataset.share)});}
function edit(id){const x=players.find(v=>v.id===id);if(!x)return;q("plId").value=x.id;q("plName").value=x.name||"";q("plPublicName").value=x.publicName||"";q("plVisibility").value=x.visibility||"private";q("plMemo").value=x.memo||"";q("plHeading").textContent="人物を編集";q("plEditor").hidden=false}
function save(){const name=q("plName").value.trim();if(!name)return alert("管理名を入力してください。");const id=q("plId").value||uuid(),x={id,name,publicName:q("plPublicName").value.trim(),visibility:q("plVisibility").value,memo:q("plMemo").value.trim()};const i=players.findIndex(v=>v.id===id);if(i>=0)players[i]=x;else players.push(x);TRPG39.savePlayers(players);reset();q("plEditor").hidden=true;render()}
async function share(id){const x=players.find(v=>v.id===id);if(!x)return;if(x.visibility==="private")return alert("この人物は「自分のみ」です。");const st=stats(x.name);try{const sid=await TRPG39Cloud.createSharedPage({kind:"player-profile",version:1,name:x.publicName||x.name,stats:st});const u=new URL("../share/index.html",location.href);u.searchParams.set("id",sid);prompt("同卓プロフィールの共有URLです。",u.href)}catch(e){alert("共有URLを作成できませんでした: "+(e.message||e))}}
q("plSort").onchange=render;q("addPlayer").onclick=()=>{reset();q("plEditor").hidden=false};q("plSave").onclick=save;q("plCancel").onclick=()=>q("plEditor").hidden=true;render();
})();
</script>
