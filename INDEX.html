<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TRPG Archive</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #101216;
      --panel: #181b21;
      --panel-hover: #20242c;
      --line: #30343d;
      --text: #eeeeee;
      --muted: #999fa9;
      --accent: #c8a96b;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        sans-serif;
      line-height: 1.7;
    }

    header {
      max-width: 1000px;
      margin: auto;
      padding: 60px 24px 35px;
    }

    .site-name {
      margin: 0;
      font-size: clamp(32px, 6vw, 56px);
      letter-spacing: 0.08em;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
    }

    nav {
      margin-top: 30px;
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 0.08em;
    }

    nav a:hover {
      color: var(--accent);
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 20px 24px 80px;
    }

    section {
      margin-top: 50px;
    }

    h2 {
      font-size: 20px;
      letter-spacing: 0.08em;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .card {
      display: block;
      padding: 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      transition: 0.2s;
    }

    .card:hover {
      background: var(--panel-hover);
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .tag {
      display: inline-block;
      margin-bottom: 12px;
      padding: 3px 8px;
      border: 1px solid var(--accent);
      border-radius: 20px;
      color: var(--accent);
      font-size: 11px;
    }

    .empty {
      color: var(--muted);
      padding: 15px 0;
    }

    footer {
      border-top: 1px solid var(--line);
      color: var(--muted);
      text-align: center;
      padding: 30px 20px;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      header {
        padding-top: 40px;
      }

      nav {
        gap: 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1 class="site-name">TRPG Archive</h1>
  <div class="subtitle">
    TRPG Scenario & Tools
  </div>

  <nav>
    <a href="./">HOME</a>
    <a href="./scenario/">SCENARIO</a>
    <a href="./tools/">TOOLS</a>
    <a href="./about/">ABOUT</a>
  </nav>
</header>

<main>

  <section>
    <h2>SCENARIO</h2>

    <div class="cards">

      <div class="card">
        <span class="tag">準備中</span>
        <h3>TRPGシナリオ</h3>
        <p>
          公開シナリオをこちらに掲載していきます。
        </p>
      </div>

    </div>
  </section>


  <section>
    <h2>TOOLS</h2>

    <div class="cards">

      <a class="card" href="./tools/dice-log/">
        <span class="tag">TOOL</span>
        <h3>ダイスログ抽出</h3>
        <p>
          セッションログから技能判定や
          クリティカル・ファンブルなどを抽出します。
        </p>
      </a>

    </div>
  </section>


  <section>
    <h2>UPDATE</h2>

    <div class="empty">
      2026.08.10　サイト準備開始
    </div>
  </section>

</main>


<footer>
  TRPG Archive
</footer>

</body>
</html>
