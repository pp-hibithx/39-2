<script>
(async()=>{
 const box=document.getElementById("shareContent");
 const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 async function sha256Text(text){const bytes=new TextEncoder().encode(String(text||""));const hash=await crypto.subtle.digest("SHA-256",bytes);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("")}
 const youtubeId=url=>{
   try{
     const u=new URL(String(url||"").trim());
     const host=u.hostname.replace(/^www\./,"").toLowerCase();
     let id="";
     if(host==="youtu.be")id=u.pathname.split("/").filter(Boolean)[0]||"";
     else if(host==="youtube.com"||host.endsWith(".youtube.com")){
       if(u.pathname==="/watch")id=u.searchParams.get("v")||"";
       else{
         const m=u.pathname.match(/^\/(?:shorts|embed|live)\/([^/?#]+)/);
         if(m)id=m[1]||"";
       }
     }
     return id;
   }catch{return ""}
 };
 const renderArticle=p=>{
   const blocks=Array.isArray(p.blocks)?p.blocks:[];
   const blocksHtml=blocks.map(b=>{
     const type=String(b?.type||"").toLowerCase();

     if(type==="text"){
       return String(b.text||"").trim()
         ? `<div class="share-article-text">${esc(b.text)}</div>`
         : "";
     }

     if(type==="image"){
       const url=String(b.url||b.src||b.imageUrl||"").trim();
       if(!url)return "";
       return `<figure class="shared-article-image">
         <img src="${esc(url)}" data-shared-article-image alt="${esc(b.alt||b.caption||"")}" loading="lazy">
         ${b.caption?`<figcaption class="small muted">${esc(b.caption)}</figcaption>`:""}
       </figure>`;
     }

     if(type==="youtube"){
       const id=youtubeId(b.url||"");
       if(!id)return "";
       return `<div class="shared-article-youtube">
         ${b.caption?`<div class="shared-article-caption">${esc(b.caption)}</div>`:""}
         <div class="shared-youtube-frame"><iframe src="https://www.youtube-nocookie.com/embed/${esc(id)}" title="YouTube video player" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
       </div>`;
     }

     if(type==="bgm"){
       const title=String(b.title||"BGM").trim();
       const artist=String(b.artist||"").trim();
       const scene=String(b.scene||"").trim();
       const audio=String(b.audioUrl||"").trim();
       const source=String(b.sourceUrl||"").trim();
       return `<section class="shared-article-bgm">
         <div class="shared-article-bgm-title">🎵 ${esc(title)}</div>
         ${(artist||scene)?`<div class="small muted">${[artist?`作者：${esc(artist)}`:"",scene?`使用シーン：${esc(scene)}`:""].filter(Boolean).join(" ／ ")}</div>`:""}
         ${audio?`<audio controls preload="metadata" src="${esc(audio)}"></audio>`:""}
         ${source?`<div><a class="link" href="${esc(source)}" target="_blank" rel="noopener noreferrer">${esc(b.sourceLabel||"配布元を開く")}</a></div>`:""}
         ${b.memo?`<div class="shared-article-note">${esc(b.memo)}</div>`:""}
       </section>`;
     }

     if(type==="conversation"){
       const lines=Array.isArray(b.lines)?b.lines:[];
       if(!lines.length)return "";
       return `<section class="shared-conversation">
         ${b.caption?`<div class="shared-conversation-caption">${esc(b.caption)}</div>`:""}
         ${lines.map(v=>{
           const name=String(v.pcName||v.speaker||"").trim();
           const image=String(v.pcImage||"").trim();
           return `<div class="shared-conversation-line">
             ${name?`<div class="shared-conversation-speaker">${image?`<img src="${esc(image)}" alt="" loading="lazy">`:""}<span>${esc(name)}</span></div>`:""}
             <div class="shared-conversation-text">${esc(v.text||"")}</div>
           </div>`;
         }).join("")}
       </section>`;
     }

     return "";
   }).join("");

   box.innerHTML=`<div class="share-article-head">
     <div class="small muted">${esc([p.scenarioTitle,p.runLabel].filter(Boolean).join(" ／ "))}</div>
     <h2>${esc(p.title||"卓記事")}</h2>
     ${p.updatedAt?`<div class="small muted">更新 ${esc(p.updatedAt)}</div>`:""}
   </div>
   ${p.body?`<div class="share-article-text">${esc(p.body)}</div>`:""}
   <div class="shared-article-blocks">${blocksHtml}</div>`;
 };
 const unlockArticle=p=>{
   if(!p.passwordRequired){renderArticle(p);return}
   box.innerHTML=`<div class="share-password"><h2>パスワード保護された卓記事です</h2><p class="small muted">共有者から案内されたパスワードを入力してください。</p><div class="share-password-row"><div><label>パスワード</label><input id="articleSharePassword" type="password" autocomplete="current-password"></div><button id="articleShareUnlock" type="button">開く</button></div><div id="articleShareError" class="share-password-error"></div></div>`;
   const input=document.getElementById("articleSharePassword"),btn=document.getElementById("articleShareUnlock"),err=document.getElementById("articleShareError");
   const check=async()=>{const hash=await sha256Text(input.value);if(hash===String(p.passwordHash||"")){renderArticle(p)}else{err.textContent="パスワードが違います。";input.select()}};btn.onclick=check;input.onkeydown=e=>{if(e.key==="Enter")check()};input.focus();
 };


 const q=id=>document.getElementById(id);
 const SCENARIO_STATUS_LABELS={
   owned:"所持",played:"通過済み",planned:"通過予定",watched:"視聴済み",
   kpDone:"回した",kpPlanned:"回す予定",wish:"気になる",roomReady:"部屋あり"
 };
 const SCENARIO_STATUS_ORDER=["owned","played","planned","watched","kpDone","kpPlanned","wish","roomReady"];
 const scenarioStatusKeys=x=>{
   if(Array.isArray(x?.statusKeys)&&x.statusKeys.length)return [...new Set(x.statusKeys.filter(k=>SCENARIO_STATUS_LABELS[k]))];
   const obj=x?.classifications||x?.flags||{};
   const keys=SCENARIO_STATUS_ORDER.filter(k=>!!obj[k]||x?.[k]===true);
   if(keys.length)return keys;
   const labels=Array.isArray(x?.statusLabels)?x.statusLabels:(Array.isArray(x?.labels)?x.labels:[]);
   return SCENARIO_STATUS_ORDER.filter(k=>labels.includes(SCENARIO_STATUS_LABELS[k]));
 };
 const normSharedSystem=v=>{
   const s=String(v||"").normalize("NFKC").toLowerCase().replace(/\s+/g,"");
   if(!s)return "unset";
   if(/(coc6|クトゥルフ神話trpg6版|クトゥルフ6版|6版)/.test(s))return "coc6";
   if(/(coc7|新クトゥルフ神話trpg|クトゥルフ7版|7版)/.test(s))return "coc7";
   if(/(エモクロア|emoklore|emokuroa)/.test(s))return "emoklore";
   return "raw:"+s;
 };
 const sharedSystemLabel=(key,items)=>{
   if(key==="all")return "すべて";
   if(key==="coc6")return "CoC6";
   if(key==="coc7")return "CoC7";
   if(key==="emoklore")return "エモクロア";
   if(key==="unset")return "未設定";
   const hit=items.find(x=>normSharedSystem(x.system)===key);
   return hit?.system||key.replace(/^raw:/,"");
 };
 const sharedRange=(a,b,suffix)=>{
   a=Number(a)||0;b=Number(b)||0;
   if(a&&b)return a===b?`${a}${suffix}`:`${a}–${b}${suffix}`;
   if(a)return `${a}${suffix}〜`;
   if(b)return `〜${b}${suffix}`;
   return "";
 };

 const sharedKanaKey=x=>{

      await TRPG39Cloud.updateSharedPage(id,{...current,messages:msgs,updatedAt:new Date().toISOString()});location.reload();
    });
    document.querySelectorAll(".room-delete").forEach(b=>b.onclick=async()=>{
      const messageId=b.dataset.messageId;if(!confirm("このコメントを削除しますか？"))return;
      const current=await TRPG39Cloud.getSharedPage(id),msgs=Array.isArray(current.messages)?current.messages.slice():[],m=msgs.find(x=>x.id===messageId),k=loadKeys()[messageId];
      if(!m||!k||m.editToken!==k)return alert("このコメントはこのブラウザから削除できません。");
      const removeIds=new Set([messageId]);let changed=true;
      while(changed){changed=false;msgs.forEach(x=>{if(x.parentId&&removeIds.has(x.parentId)&&!removeIds.has(x.id)){removeIds.add(x.id);changed=true}})}
      const next=msgs.filter(x=>!removeIds.has(x.id));
      await TRPG39Cloud.updateSharedPage(id,{...current,messages:next,updatedAt:new Date().toISOString()});
      const nextKeys=loadKeys();removeIds.forEach(x=>delete nextKeys[x]);saveKeys(nextKeys);location.reload();
    });
    return
  }
  if(p.kind==="calendar-availability"){const days=p.days||[];box.innerHTML=`<h2>${esc(p.label||"空き日カレンダー")}</h2><div class="share-cal">${days.map(d=>`<div class="share-day"><div class="num">${esc(d.date)}</div><div class="${d.state==="free"?"free":"busy"}">${d.state==="free"?"○ 空き":"予定あり"}</div></div>`).join("")}</div>`;return}
  if(p.kind==="scenario-list"||p.kind==="scenarios"||Array.isArray(p.scenarios)||Array.isArray(p.items)){const items=Array.isArray(p.scenarios)?p.scenarios:(p.items||[]);renderScenarioShelf(p,items);return}
  if(p.kind==="scenario"||p.scenario){const x=p.scenario||p;box.innerHTML=`<h2>${esc(x.title||x.name||"SCENARIO")}</h2>${x.thumbnailUrl||x.image||x.imageUrl?`<img src="${esc(x.thumbnailUrl||x.image||x.imageUrl)}" alt="" style="max-width:520px;width:100%;border-radius:8px;border:1px solid var(--line)">`:""}${x.author?`<p><strong>作者</strong> ${esc(x.author)}</p>`:""}${x.description||x.memo?`<p style="white-space:pre-wrap">${esc(x.description||x.memo)}</p>`:""}`;return}
  box.innerHTML="<p>この共有データ形式には対応していません。</p>";
 }catch(e){console.error(e);box.innerHTML=`<p>共有ページを読み込めませんでした。<br><span class="small">${esc(e.message||e)}</span></p>`}
})();
</script><dialog id="shareArticleImageViewer" class="share-article-viewer">
 <div class="share-article-viewer-panel">
  <button type="button" id="shareArticleImageViewerClose" class="share-article-viewer-close">×</button>
  <img id="shareArticleImageViewerImg" alt="拡大画像">
 </div>
</dialog>
<script>
(()=>{
 const viewer=document.getElementById("shareArticleImageViewer"),viewImg=document.getElementById("shareArticleImageViewerImg");
 document.addEventListener("click",e=>{
   const img=e.target.closest(".shared-article-image img,.share-article-image img,.article-image-block img,figure.article-image img,[data-shared-article-image]");
   if(!img||!viewer||!viewImg)return;
   viewImg.src=img.src||img.getAttribute("src")||"";
   if(viewImg.src)viewer.showModal();
 });
 document.getElementById("shareArticleImageViewerClose")?.addEventListener("click",()=>viewer.close());
 viewer?.addEventListener("click",e=>{if(e.target===viewer)viewer.close()});
})();
</script>
