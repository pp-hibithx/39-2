<style>
.share-page{display:grid;gap:14px}
.share-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.share-meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.share-list{display:grid;gap:8px}
.share-row{border-top:1px solid rgba(255,255,255,.07);padding-top:8px}
.share-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10)}
.share-day{min-height:68px;background:var(--panel);padding:6px;font-size:12px}
.share-day .num{color:var(--muted);font-size:11px}
.free{margin-top:6px;font-weight:700}
.busy{margin-top:6px;color:var(--muted)}
@media(max-width:760px){.share-cal{font-size:11px}.share-day{min-height:54px;padding:4px}}

.share-scenario-tools{display:grid;gap:10px;margin:12px 0 14px}

.share-scenario-tab.active{font-weight:700;box-shadow:inset 0 0 0 1px var(--accent)}
.share-scenario-search{max-width:520px}
.share-scenario-count{font-size:12px;color:var(--muted)}
.share-row[hidden]{display:none}
.share-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
</style>
<style>
.share-article{margin-top:10px;line-height:1.8}
.share-spoiler{margin-top:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.share-spoiler summary{cursor:pointer;padding:9px 11px;font-weight:700;user-select:none}
.share-spoiler .spoiler-body{padding:10px 12px;border-top:1px solid var(--line);line-height:1.8}
.share-report-block{margin-top:12px;line-height:1.7}.share-report-block>strong{display:block;margin-bottom:4px}</style>

<body>
<header class="site-header"><div class="wrap"><h1 class="brand brand-392">SAKU+MERU <span class="hibiscus-logo" aria-hidden="true">🌺</span></h1><div class="tagline">探す・遊ぶ・記録・共有<br>TRPG Scenario &amp; Tools</div><nav class="nav"><a href="../index.html">HOME</a><a href="../scenario/index.html?v=0292">SCENARIO</a><a href="../calendar/index.html?v=0292">CALENDAR</a><a href="../library/index.html?v=0292">LIBRARY</a><a href="../pcs/index.html?v=0292">PC</a><a href="../players/index.html?v=0292">PLAYERS</a><a href="../tools/index.html">TOOLS</a><a href="../backup/index.html">BACKUP</a><a href="../help/index.html">HELP</a><a href="../about/index.html">ABOUT</a><a href="../settings/index.html">SETTINGS</a></nav><div class="theme-switcher" aria-label="テーマ">
<button type="button" data-theme-choice="system">端末</button>

<button type="button" data-theme-choice="dark">ダーク</button>
<span>·</span>

</div></div></header>
<main><div class="wrap share-page">
  <div class="hero"><h2>SHARED</h2><p>SAKU+MERUで共有されたページです。</p></div>
  <div id="shareContent" class="share-card"><p>読み込み中...</p></div>
</div></main>
<footer class="footer"><div class="wrap">© <span data-year></span> SAKU+MERU</div></footer>
<script src="../assets/js/main.js?v=0292"></script>
<script src="../assets/js/supabase-config.js?v=0292"></script>
<script src="../assets/js/supabase-share.js?v=02307"></script>
<script>
(async()=>{
 const box=document.getElementById("shareContent");
 const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 const reportHtml=p=>{
   const rows=Array.isArray(p.participantRows)?p.participantRows.slice():[];
   const selfRole=String(p.selfRole||"").trim();
   const selfPc=String(p.selfPcName||"").trim();
   if(selfRole){
     rows.push({
       role:selfRole,
       ho:"",
       plName:"自分",
       pcName:selfRole==="PL"?selfPc:"",
       relation:""
     });
   }
   if(!rows.length){
     return (p.participants||[]).length?`<p><strong>参加者</strong><br>${esc((p.participants||[]).join(" / "))}</p>`:"";
   }
   const groups=new Map();
   rows.forEach(r=>{
     const role=String(r.role||"PL");
     if(!groups.has(role))groups.set(role,[]);
     groups.get(role).push(r);
   });
   const order=["KP","SKP","PL","その他"];
   return order.filter(role=>groups.has(role)).map(role=>{
     const rs=groups.get(role);
     if(role==="PL"){
       return `<div class="share-report-block"><strong>PL / PC</strong>${rs.map(r=>`<div>${r.ho?`${esc(r.ho)}：`:""}${esc(r.plName||"")} ${r.pcName?`/ ${esc(r.pcName)}`:""}</div>`).join("")}</div>`;
     }
     return `<div class="share-report-block"><strong>${esc(role)}</strong>${rs.map(r=>`<div>${r.ho?`${esc(r.ho)}：`:""}${esc(r.plName||"")}${r.pcName?` / ${esc(r.pcName)}`:""}</div>`).join("")}</div>`;
   }).join("");
 };
 const id=new URLSearchParams(location.search).get("id")||location.hash.replace(/^#/,"");
 if(!id){box.innerHTML="<p>共有IDがありません。</p>";return;}
 try{
   const payload=await TRPG39Cloud.getSharedPage(id);
   const legacyPayload=Array.isArray(payload)?{kind:"scenario-list",items:payload}:payload;
   const p=legacyPayload;
   if(!payload)throw new Error("共有データが見つかりません");
   if(legacyPayload.kind==="library-session"){
     box.innerHTML=`<h2>${esc(legacyPayload.title||"LIBRARY")}</h2>
       <div class="share-meta">${legacyPayload.system?`<span class="badge">${esc(legacyPayload.system)}</span>`:""}${p.role?`<span class="badge">${esc(p.role)}</span>`:""}${p.date?`<span class="badge">${esc(p.date)}</span>`:""}</div>
       ${p.image?`<img src="${esc(p.image)}" alt="" style="max-width:420px;width:100%;border-radius:8px;border:1px solid var(--line);margin-bottom:10px">`:""}
       ${reportHtml(p)}
       ${p.comment?`<div class="share-report-block"><strong>ひとこと</strong><p style="white-space:pre-wrap;margin:.35em 0 0">${esc(p.comment)}</p></div>`:""}
       ${p.spoiler?`<details class="spoiler"><summary>⚠ ネタバレ</summary><div class="spoiler-body">${esc(p.spoiler)}</div></details>`:""}`;
   } else if(legacyPayload.kind==="calendar-availability"){
     const days=p.days||[];
     box.innerHTML=`<h2>${esc(legacyPayload.label||"空き日カレンダー")}</h2>
       <p class="small">共有されているのは空き状況だけです。予定の内容は表示されません。</p>
       <div class="share-cal">${days.map(d=>`<div class="share-day"><div class="num">${esc(d.date)}</div><div class="${d.state==="free"?"free":"busy"}">${d.state==="free"?"○ 空き":"予定あり"}</div></div>`).join("")}</div>`;

   } else if(legacyPayload.kind==="scenario-list" || legacyPayload.kind==="scenarios" || Array.isArray(legacyPayload.scenarios) || Array.isArray(legacyPayload.items)){
     const items=Array.isArray(legacyPayload.scenarios)?legacyPayload.scenarios:(Array.isArray(legacyPayload.items)?legacyPayload.items:[]);
     const title=legacyPayload.title||legacyPayload.label||"SCENARIO";
     const classLabels={owned:"所持",wish:"気になる",played:"通過済み",watched:"視聴済み",planned:"通過予定",kpDone:"回した",kpPlanned:"回す予定",roomReady:"部屋あり"};

     const normalized=items.map((x,i)=>{
       const c={};

       // v5: 共有元カードと同じ分類キーをそのまま利用。
       const keys=Array.isArray(x.statusKeys)?x.statusKeys:[];
       keys.forEach(k=>{if(k in classLabels)c[k]=true});

       const explicitLabels=Array.isArray(x.statusLabels)?x.statusLabels:[];
       Object.entries(classLabels).forEach(([k,v])=>{
         if(explicitLabels.includes(v))c[k]=true;
       });

       // v4以前との互換
       Object.assign(c,(x.classifications&&typeof x.classifications==="object")?x.classifications:{});
       const rawFlags=(x.flags&&typeof x.flags==="object")?x.flags:{};
       Object.keys(classLabels).forEach(k=>{
         if(rawFlags[k]===true)c[k]=true;
         if(x[k]===true)c[k]=true;
       });
       const labels=Array.isArray(x.labels)?x.labels:[];
       Object.entries(classLabels).forEach(([k,v])=>{
         if(labels.includes(v))c[k]=true;
       });

       return {...x,_idx:i,_classifications:c};
     });

     box.innerHTML=`<h2>${esc(title)}</h2>
       <p class="small">共有されたシナリオ棚です。分類を切り替えて見ることができます。${legacyPayload.shareFormat==="scenario-shelf-v5"?"":"（旧形式の共有データ）"}</p>
       <div class="share-scenario-tools">
         <div class="share-scenario-tabs">
           <button type="button" class="share-scenario-tab active" data-share-scenario-filter="">すべて</button>
           <button type="button" class="share-scenario-tab" data-share-scenario-filter="owned">所持</button>
           <button type="button" class="share-scenario-tab" data-share-scenario-filter="wish">気になる</button>
           <button type="button" class="share-scenario-tab" data-share-scenario-filter="played">通過済み</button>
           <button type="button" class="share-scenario-tab" data-share-scenario-filter="watched">視聴済み</button>
           <button type="button" class="share-scenario-tab" data-share-scenario-filter="planned">通過予定</button>
           <button type="button" class="share-scenario-tab" data-share-scenario-filter="kpDone">回した</button>
           <button type="button" class="share-scenario-tab" data-share-scenario-filter="kpPlanned">回す予定</button>
           <button type="button" class="share-scenario-tab" data-share-scenario-filter="roomReady">部屋あり</button>
         </div>
         <input id="shareScenarioSearch" class="share-scenario-search" type="search" placeholder="シナリオ名・システム・作者・タグで検索">
         <div id="shareScenarioCount" class="share-scenario-count"></div>
       </div>
       <div id="shareScenarioList" class="share-list">${normalized.length?normalized.map(x=>`
         <article class="share-row" data-share-item="${x._idx}">
           <div style="display:flex;gap:10px;align-items:flex-start">
             ${x.thumbnailUrl||x.image||x.imageUrl?`<img src="${esc(x.thumbnailUrl||x.image||x.imageUrl)}" alt="" style="width:120px;aspect-ratio:16/10;object-fit:cover;border-radius:7px;border:1px solid var(--line)">`:`<div style="width:120px;aspect-ratio:16/10;display:grid;place-items:center;border:1px solid var(--line);border-radius:7px;font-size:28px">🌺</div>`}
             <div>
               <h3 style="margin:0 0 5px">${esc(x.title||x.name||"名称未設定")}</h3>
               <div class="share-meta">
                 ${x.system?`<span class="badge">${esc(x.system)}</span>`:""}
                 ${x.playersMin||x.playersMax?`<span class="badge">${esc((x.playersMin||x.playersMax||"")+"〜"+(x.playersMax||x.playersMin||"")+"人")}</span>`:""}
                 ${x.hoursMin||x.hoursMax?`<span class="badge">${esc((x.hoursMin||x.hoursMax||"")+"〜"+(x.hoursMax||x.hoursMin||"")+"h")}</span>`:""}
                 ${Object.entries(x._classifications).filter(([,v])=>v).map(([k])=>classLabels[k]?`<span class="badge">${esc(classLabels[k])}</span>`:"").join("")}
               </div>
               ${x.author?`<div class="small">${esc(x.author)}</div>`:""}${x.roomImageUrl?`<details style="margin-top:8px"><summary class="small">部屋を見る</summary><img src="${esc(x.roomImageUrl)}" alt="部屋画像" style="margin-top:6px;width:min(100%,520px);aspect-ratio:16/10;object-fit:cover;border-radius:8px;border:1px solid var(--line)"></details>`:""}
               ${(x.tags||[]).length?`<div class="share-tags">${x.tags.map(t=>`<span class="badge">#${esc(t)}</span>`).join("")}</div>`:""}
               ${x.url?`<div style="margin-top:6px"><a class="link" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">配布・掲載ページ</a></div>`:""}
             </div>
           </div>
         </article>`).join(""):`<p>共有されたシナリオはありません。</p>`}</div>`;

     let scenarioFilter="";
     const searchInput=document.getElementById("shareScenarioSearch");
     const countEl=document.getElementById("shareScenarioCount");
     const applyScenarioShelfFilter=()=>{
       const term=String(searchInput?.value||"").trim().normalize("NFKC").toLowerCase();
       let visible=0;
       normalized.forEach(x=>{
         const classOk=!scenarioFilter||!!x._classifications?.[scenarioFilter];
         const searchText=[x.title,x.shortTitle,x.system,x.author,(x.tags||[]).join(" ")].filter(Boolean).join(" ").normalize("NFKC").toLowerCase();
         const searchOk=!term||searchText.includes(term);
         const el=document.querySelector(`[data-share-item="${x._idx}"]`);
         if(el)el.hidden=!(classOk&&searchOk);
         if(classOk&&searchOk)visible++;
       });
       if(countEl)countEl.textContent=`${visible}件 / 全${normalized.length}件`;
     };
     document.querySelectorAll("[data-share-scenario-filter]").forEach(btn=>{
       btn.onclick=()=>{
         scenarioFilter=btn.dataset.shareScenarioFilter||"";
         document.querySelectorAll("[data-share-scenario-filter]").forEach(b=>b.classList.toggle("active",b===btn));
         applyScenarioShelfFilter();
       };
     });
     if(searchInput)searchInput.oninput=applyScenarioShelfFilter;
     applyScenarioShelfFilter();

   } else if(legacyPayload.kind==="scenario" || legacyPayload.scenario || (legacyPayload.title && (legacyPayload.system || legacyPayload.author || legacyPayload.thumbnailUrl || legacyPayload.status))){
     const x=legacyPayload.scenario||payload;
     box.innerHTML=`<h2>${esc(x.title||x.name||"SCENARIO")}</h2>
       <div class="share-meta">
         ${x.system?`<span class="badge">${esc(x.system)}</span>`:""}
         ${x.status?`<span class="badge">${esc(x.status)}</span>`:""}
       </div>
       ${x.thumbnailUrl||x.image||x.imageUrl?`<img src="${esc(x.thumbnailUrl||x.image||x.imageUrl)}" alt="" style="max-width:520px;width:100%;border-radius:8px;border:1px solid var(--line);margin-bottom:10px">`:`<div style="font-size:52px;margin:8px 0">🌺</div>`}
       ${x.author?`<p><strong>作者</strong>　${esc(x.author)}</p>`:""}
       ${x.description||x.memo?`<p style="white-space:pre-wrap">${esc(x.description||x.memo)}</p>`:""}`;

   } else {
     box.innerHTML="<p>この共有データ形式には対応していません。</p>";
   }
 }catch(e){console.error(e);box.innerHTML=`<p>共有ページを読み込めませんでした。<br><span class="small">${esc(e.message||e)}</span></p>`}
})();
</script>
