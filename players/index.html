<script>
(()=>{"use strict";
const q=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let players=TRPG39.loadPlayers(),album=TRPG39.loadAlbum();const uuid=()=>TRPG39.uuid?TRPG39.uuid():crypto.randomUUID();

const normalizeRole=r=>String(r||"PL").trim()||"PL";
const normalizeUrls=v=>Array.isArray(v)?v.map(x=>String(x||"").trim()).filter(Boolean):String(v||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean);

function allPlayerRows(name){
 const key=String(name||"").trim(),matches=[];
 album.forEach(x=>{
   const rows=Array.isArray(x.participantRows)&&x.participantRows.length
     ? x.participantRows
     : (x.participants||[]).map(n=>({plName:n,role:"PL",pcName:"",relation:""}));
   rows.filter(r=>String(r.plName||"").trim()===key).forEach(r=>matches.push({record:x,row:r}));
 });
 const runMap=new Map();
 matches.forEach(({record,row})=>{
   const runKey=record.runId
     ? `run:${record.runId}|${normalizeRole(row.role)}|${String(row.pcName||"").trim()}`
     : `legacy:${record.scenarioId||record.title||""}|${record.runLabel||""}|${normalizeRole(row.role)}|${String(row.pcName||"").trim()}`;
   const dt=String(record.start||record.date||"9999-12-31");
   if(!runMap.has(runKey)||dt<String(runMap.get(runKey).record.start||runMap.get(runKey).record.date||"9999-12-31")){
     runMap.set(runKey,{record,row});
   }
 });
 return [...runMap.values()].map(({record:x,row:r})=>({
   title:x.title||"名称未設定",
   scenarioId:x.scenarioId||"",
   date:x.date||String(x.start||"").slice(0,10)||"",
   system:String(x.system||"").trim()||"システム未設定",
   role:normalizeRole(r.role),
   pcName:String(r.pcName||"").trim()||"PC不明",
   relation:String(r.relation||"").trim(),
   selfPc:String(x.pcName||"").trim()
 })).sort((a,b)=>String(a.date||"9999").localeCompare(String(b.date||"9999"))||a.title.localeCompare(b.title,"ja"));
}

function stats(name){
 const rows=allPlayerRows(name),scenarioMap=new Map();
 rows.forEach(r=>{
   const k=r.scenarioId||r.title;
   if(!scenarioMap.has(k))scenarioMap.set(k,r);
 });
 const dates=rows.map(r=>r.date).filter(Boolean).sort();
 return {
   count:scenarioMap.size,
   first:dates[0]||"",
   last:dates.at(-1)||"",
   rows,
   systems:[...new Set(rows.map(r=>r.system))].sort((a,b)=>a.localeCompare(b,"ja")),
   roles:[...new Set(rows.map(r=>r.role))].sort((a,b)=>a.localeCompare(b,"ja")),
   pcs:[...new Set(rows.map(r=>r.pcName).filter(x=>x&&x!=="PC不明"))].sort((a,b)=>a.localeCompare(b,"ja"))
 };
}
function contactHistoryHtml(x){
 const rows=Array.isArray(x.contactHistory)?x.contactHistory.slice().sort((a,b)=>String(b.at||"").localeCompare(String(a.at||""))):[];
 if(!rows.length)return "";
 return `<details class="player-contact-history"><summary>連絡先履歴 ${rows.length}件</summary>
   ${rows.map(v=>`<div class="player-contact-history-row">${esc(v.at||"")} ／ ${esc(v.type||"連絡先")}：${esc(v.value||"")} → 登録解除</div>`).join("")}
 </details>`;
}
function filteredHistoryHtml(x,st,system="",role="",pc=""){
 const rows=st.rows.filter(r=>(!system||r.system===system)&&(!role||r.role===role)&&(!pc||r.pcName===pc));
 if(!rows.length)return '<div class="small muted">該当する同卓記録はありません。</div>';
 return `<div class="player-history-flat">${rows.map(r=>`<div class="history-row">
   <div>${esc(r.date||"")}</div>
   <div class="player-history-main">
     <div class="player-history-title"><a class="link" href="../library/index.html?player=${encodeURIComponent(x.name)}${r.scenarioId?`&scenario=${encodeURIComponent(r.scenarioId)}`:""}">${esc(r.title)}</a></div>
     ${r.relation?`<div class="player-history-sub">関係：${esc(r.relation)}</div>`:""}
   </div>
   <div>${esc(r.role)}</div>
   <div>${r.pcName!=="PC不明"?esc(r.pcName):'<span class="muted">PC不明</span>'}${r.selfPc?`<div class="player-history-sub">自PC：${esc(r.selfPc)}</div>`:""}</div>
 </div>`).join("")}</div>`;
}
function reset(){
 ["plId","plName","plPublicName","plSocialName","plXId","plDiscordId","plScenarioShareUrls","plAvailabilityShareUrl","plMemo"].forEach(x=>q(x).value="");
 q("plExcluded").checked=false;q("plVisibility").value="private";q("plHeading").textContent="人物を追加";
}
function cardHtml(x,st){
 const scenarioUrls=normalizeUrls(x.scenarioShareUrls);
 return `<details class="dir-card" ${new URLSearchParams(location.search).get("focus")===x.id?"open":""} data-player-card="${esc(x.id)}">
   <summary>
     <h3 style="display:inline">${esc(x.name)}</h3>
     <div class="dir-meta">公開名：${esc(x.publicName||x.name)}${x.socialName?` ／ SNS：${esc(x.socialName)}`:""}${x.excluded?` ／ <span class="muted">表示から除外</span>`:""}</div>
     <div class="dir-meta">同卓 ${st.count}シナリオ${st.first?` ／ 初同卓 ${esc(st.first)}`:""}${st.last?` ／ 最終同卓 ${esc(st.last)}`:""}</div>
     <div class="player-meta-badges">${x.xId?'<span class="badge">X</span>':""}${x.discordId?'<span class="badge">Discord</span>':""}${scenarioUrls.length?'<span class="badge">シナリオ共有</span>':""}${x.availabilityShareUrl?'<span class="badge">空き日共有</span>':""}</div>
   </summary>
   <div class="scenario-history">
     <div class="player-detail-filters">
       <div><label>システム</label><select data-filter-system="${esc(x.id)}"><option value="">すべて</option>${st.systems.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("")}</select></div>
       <div><label>役割</label><select data-filter-role="${esc(x.id)}"><option value="">すべて</option>${st.roles.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("")}</select></div>
       <div><label>キャラクター</label><select data-filter-pc="${esc(x.id)}"><option value="">すべて</option>${st.pcs.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("")}</select></div>
     </div>
     <div data-history-box="${esc(x.id)}">${filteredHistoryHtml(x,st)}</div>

     <div class="player-contact-box">
       <div class="player-contact-grid">
         <div><strong>X</strong><div>${x.xId?esc(x.xId):'<span class="muted">未登録</span>'}</div></div>
         <div><strong>Discord</strong><div>${x.discordId?esc(x.discordId):'<span class="muted">未登録</span>'}</div></div>
       </div>
       <div class="player-share-links">
         ${scenarioUrls.map((u,i)=>`<a class="link" href="${esc(u)}" target="_blank" rel="noopener noreferrer">シナリオ共有URL ${i+1}</a>`).join("")}
         ${x.availabilityShareUrl?`<a class="link" href="${esc(x.availabilityShareUrl)}" target="_blank" rel="noopener noreferrer">空き日共有URL</a>`:""}
         ${!scenarioUrls.length&&!x.availabilityShareUrl?'<span class="small muted">共有URLは未登録です。</span>':""}
       </div>
       ${contactHistoryHtml(x)}
     </div>

     <div class="dir-actions">
       <a class="link" href="../library/index.html?player=${encodeURIComponent(x.name)}">LIBRARYで全記録を見る</a>
       <button data-edit="${x.id}">編集</button>
       <button data-share="${x.id}">共有</button>
     </div>
   </div>
 </details>`;
}
function bindCardFilters(){
 document.querySelectorAll("[data-player-card]").forEach(card=>{
   const id=card.dataset.playerCard,x=players.find(v=>v.id===id);if(!x)return;
   const st=stats(x.name),sys=card.querySelector("[data-filter-system]"),role=card.querySelector("[data-filter-role]"),pc=card.querySelector("[data-filter-pc]"),box=card.querySelector("[data-history-box]");
   const apply=()=>box.innerHTML=filteredHistoryHtml(x,st,sys.value,role.value,pc.value);
   [sys,role,pc].forEach(el=>el.onchange=apply);
 });
}
function render(){
 q("plSummary").textContent=`登録 ${players.length}人`;
 const mode=q("plSort")?.value||"name";
 const rows=players.map(x=>({x,st:stats(x.name)})).sort((a,b)=>
   mode==="count"?(b.st.count-a.st.count)||a.x.name.localeCompare(b.x.name,"ja")
   :mode==="recent"?String(b.st.last||"").localeCompare(String(a.st.last||""))||a.x.name.localeCompare(b.x.name,"ja")
   :a.x.name.localeCompare(b.x.name,"ja")
 );
 q("plList").innerHTML=rows.length?rows.map(({x,st})=>cardHtml(x,st)).join(""):'<div class="empty">まだ人物が登録されていません。</div>';
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=e=>{e.preventDefault();edit(b.dataset.edit)});
 document.querySelectorAll("[data-share]").forEach(b=>b.onclick=e=>{e.preventDefault();share(b.dataset.share)});
 bindCardFilters();
}
function edit(id){
 const x=players.find(v=>v.id===id);if(!x)return;
 q("plId").value=x.id;q("plName").value=x.name||"";q("plPublicName").value=x.publicName||"";q("plSocialName").value=x.socialName||"";
 q("plXId").value=x.xId||"";q("plDiscordId").value=x.discordId||"";
 q("plScenarioShareUrls").value=normalizeUrls(x.scenarioShareUrls).join("\n");
 q("plAvailabilityShareUrl").value=x.availabilityShareUrl||"";
 q("plExcluded").checked=!!x.excluded;q("plVisibility").value=x.visibility||"private";q("plMemo").value=x.memo||"";
 q("plHeading").textContent="人物を編集";q("plEditor").hidden=false;
}
function save(){
 const name=q("plName").value.trim();if(!name)return alert("管理名を入力してください。");
 const id=q("plId").value||uuid(),old=players.find(v=>v.id===id)||{},history=Array.isArray(old.contactHistory)?old.contactHistory.slice():[];
 const xId=q("plXId").value.trim(),discordId=q("plDiscordId").value.trim(),today=new Date().toISOString().slice(0,10);
 const oldX=String(old.xId||"").trim(),oldDiscord=String(old.discordId||"").trim();
 if(oldX&&oldX!==xId)history.push({type:"X",value:oldX,at:today});
 if(oldDiscord&&oldDiscord!==discordId)history.push({type:"Discord",value:oldDiscord,at:today});
 const x={...old,id,name,publicName:q("plPublicName").value.trim(),socialName:q("plSocialName").value.trim(),
   xId,discordId,contactHistory:history,scenarioShareUrls:normalizeUrls(q("plScenarioShareUrls").value),
   availabilityShareUrl:q("plAvailabilityShareUrl").value.trim(),
   excluded:q("plExcluded").checked,visibility:q("plVisibility").value,memo:q("plMemo").value.trim()};
 const i=players.findIndex(v=>v.id===id);if(i>=0)players[i]=x;else players.push(x);
 TRPG39.savePlayers(players);reset();q("plEditor").hidden=true;render();
}
async function share(id){
 const x=players.find(v=>v.id===id);if(!x)return;if(x.visibility==="private")return alert("この人物は「自分のみ」です。");
 const st=stats(x.name);
 try{
   const sid=await TRPG39Cloud.createSharedPage({kind:"player-profile",version:2,name:x.publicName||x.name,stats:st});
   const u=new URL("../share/index.html",location.href);u.searchParams.set("id",sid);prompt("同卓プロフィールの共有URLです。",u.href)
 }catch(e){alert("共有URLを作成できませんでした: "+(e.message||e))}
}
q("plSort").onchange=render;q("addPlayer").onclick=()=>{reset();q("plEditor").hidden=false};q("plSave").onclick=save;q("plCancel").onclick=()=>q("plEditor").hidden=true;render();
})();
</script>

</body></html>
