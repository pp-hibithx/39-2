<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHARE｜SAKU+MERU</title>
<meta name="description" content="「一緒に」探す・遊ぶ・記録・共有。卓のあれこれをサクッとまとめるサイト。">
<script>(()=>{try{const k="trpg39_theme",v=localStorage.getItem(k)||"system",m=(v==="light"||v==="dark")?v:(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"),r=document.documentElement;r.setAttribute("data-theme",m);r.classList.add(m==="light"?"theme-light":"theme-dark");r.style.colorScheme=m}catch(e){}})();</script>
<link rel="stylesheet" href="../assets/css/style-v0296.css"><script defer src="../assets/js/theme-v0296.js"></script>
<style>
.share-page{display:grid;gap:14px}.share-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}.share-meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}.share-list{display:grid;gap:8px}.share-row{border-top:1px solid rgba(255,255,255,.07);padding-top:8px}.share-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10)}.share-day{min-height:68px;background:var(--panel);padding:6px;font-size:12px}.share-day .num{color:var(--muted);font-size:11px}.free{margin-top:6px;font-weight:700}.busy{margin-top:6px;color:var(--muted)}
.share-article-body{white-space:pre-wrap;line-height:1.9;margin-top:16px}.share-article-head{border-bottom:1px solid var(--line);padding-bottom:12px}.share-password{max-width:480px;margin:12px auto;text-align:left}.share-password-row{display:flex;gap:8px;align-items:end}.share-password-row>div{flex:1}.share-password-row button{width:auto;white-space:nowrap}.share-password-error{font-size:12px;margin-top:6px;color:var(--muted)}
.share-scenario-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:12px}.share-scenario-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}.share-scenario-thumb{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}.share-scenario-placeholder{width:100%;aspect-ratio:16/10;display:grid;place-items:center;font-size:34px}.share-scenario-body{padding:12px}.share-scenario-title{font-weight:700}.share-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.share-report-block{margin-top:12px;line-height:1.7}.share-report-block>strong{display:block;margin-bottom:4px}.share-spoiler{margin-top:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden}.share-spoiler summary{cursor:pointer;padding:9px 11px;font-weight:700}.share-spoiler .spoiler-body{padding:10px 12px;border-top:1px solid var(--line)}
@media(max-width:760px){.share-cal{font-size:11px}.share-day{min-height:54px;padding:4px}.share-password-row{display:grid}}
</style>

<style>
.share-article-blocks{display:grid;gap:18px;margin-top:18px}
.share-block-text{line-height:1.85;white-space:normal;overflow-wrap:anywhere}
.share-block-image{margin:0;text-align:center}.share-block-image img{display:block;max-width:100%;height:auto;margin:auto;border:1px solid var(--line);border-radius:10px}.share-block-image figcaption{margin-top:6px;font-size:12px;color:var(--muted)}
.share-block-placeholder{padding:28px;border:1px dashed var(--line);border-radius:10px;text-align:center;color:var(--muted)}
.share-conversation{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px}.share-conversation h3{margin:0 0 3px}
.share-conversation-line{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr);gap:10px;align-items:start}.share-conversation-line strong,.share-conversation-line>div{padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.035)}.share-conversation-line>div{white-space:pre-wrap}
.share-youtube{position:relative;width:100%;aspect-ratio:16/9;margin-top:7px;border-radius:10px;overflow:hidden;background:#000}.share-youtube iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.share-bgm{padding:12px;border-left:3px solid var(--accent);border-radius:8px;background:rgba(255,255,255,.02);display:grid;gap:7px}.share-bgm audio{width:100%}
@media(max-width:620px){.share-conversation-line{grid-template-columns:1fr;gap:3px}}
</style>
</head>
<body>
<header class="site-header"><div class="wrap"><h1 class="brand brand-392">SAKU+MERU <span class="hibiscus-logo" aria-hidden="true">🌺</span></h1><div class="tagline">探す・遊ぶ・記録・共有<br>TRPG Scenario &amp; Tools</div><nav class="nav"><a href="../index.html">HOME</a><a href="../scenario/index.html?v=0292">SCENARIO</a><a href="../calendar/index.html?v=0292">CALENDAR</a><a href="../library/index.html?v=0292">LIBRARY</a><a href="../pcs/index.html?v=0292">PC</a><a href="../players/index.html?v=0292">PLAYERS</a><a href="../tools/index.html">TOOLS</a><a href="../backup/index.html">BACKUP</a><a href="../help/index.html">HELP</a><a href="../about/index.html">ABOUT</a><a href="../settings/index.html">SETTINGS</a></nav></div></header>
<main><div class="wrap share-page"><div class="hero"><h2>SHARED</h2><p>SAKU+MERUで共有されたページです。</p></div><div id="shareContent" class="share-card"><p>読み込み中...</p></div></div></main>
<footer class="footer"><div class="wrap">© <span data-year></span> SAKU+MERU</div></footer>
<script src="../assets/js/main.js?v=0292"></script><script src="../assets/js/supabase-config.js?v=0292"></script><script src="../assets/js/supabase-share.js?v=02307"></script>
<script>
(async()=>{
 const box=document.getElementById("shareContent");
 const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 async function sha256Text(text){const bytes=new TextEncoder().encode(String(text||""));const hash=await crypto.subtle.digest("SHA-256",bytes);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("")}
 const youtubeId=url=>{try{const u=new URL(String(url||"").trim()),h=u.hostname.replace(/^www\./,"").toLowerCase();let id="";if(h==="youtu.be")id=u.pathname.split("/").filter(Boolean)[0]||"";else if(h==="youtube.com"||h.endsWith(".youtube.com")){if(u.pathname==="/watch")id=u.searchParams.get("v")||"";else{id=(u.pathname.match(/^\/(?:shorts|embed|live)\/([^/?#]+)/)||[])[1]||""}}return /^[A-Za-z0-9_-]{6,20}$/.test(id)?id:""}catch{return ""}};
 const conversationLines=b=>Array.isArray(b?.lines)?b.lines:(String(b?.raw||"").split(/\r?\n/).map(line=>{const m=String(line||"").trim().match(/^(.{1,40}?)[｜|：:]\s*(.*)$/);return m?{speaker:m[1],text:m[2]}:{speaker:"",text:String(line||"").trim()}}).filter(v=>v.text||v.speaker));
 const sharedBlockHtml=b=>{
   if(!b||!b.type)return "";
   if(b.type==="text")return `<div class="share-block-text">${esc(b.text||"").replace(/\n/g,"<br>")}</div>`;
   if(b.type==="image"){const u=String(b.url||"").trim();return u?`<figure class="share-block-image"><img src="${esc(u)}" alt="${esc(b.caption||"")}" loading="lazy">${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:""}</figure>`:`<div class="share-block-placeholder">画像未設定</div>`}
   if(b.type==="conversation"){const lines=conversationLines(b);return `<section class="share-conversation">${b.caption?`<h3>${esc(b.caption)}</h3>`:""}${lines.map(v=>`<div class="share-conversation-line">${v.speaker?`<strong>${esc(v.speaker)}</strong>`:""}<div>${esc(v.text||"")}</div></div>`).join("")}</section>`}
   if(b.type==="youtube"){const id=youtubeId(b.url);return id?`<div class="share-youtube-wrap">${b.caption?`<strong>${esc(b.caption)}</strong>`:""}<div class="share-youtube"><iframe src="https://www.youtube-nocookie.com/embed/${esc(id)}" title="YouTube video player" loading="lazy" allowfullscreen></iframe></div></div>`:""}
   if(b.type==="bgm"){const audio=String(b.audioUrl||"").trim(),source=String(b.sourceUrl||"").trim();return `<section class="share-bgm"><strong>${esc(b.title||"BGM")}</strong>${b.artist?`<div class="small muted">${esc(b.artist)}</div>`:""}${audio?`<audio controls preload="none" src="${esc(audio)}"></audio>`:""}${source?`<div><a href="${esc(source)}" target="_blank" rel="noopener noreferrer">配布元・参照先を開く</a></div>`:""}${!audio&&b.localAudioId?`<div class="small muted">この端末だけに保存された音声は共有されません。</div>`:""}${b.memo?`<div>${esc(b.memo).replace(/\n/g,"<br>")}</div>`:""}</section>`}
   return "";
 };
 const renderArticle=p=>{const blocks=Array.isArray(p.blocks)?p.blocks:[];const body=blocks.length?blocks.map(sharedBlockHtml).join(""):`<div class="share-article-body">${esc(p.body||"").replace(/\n/g,"<br>")}</div>`;box.innerHTML=`<div class="share-article-head"><div class="small muted">${esc([p.scenarioTitle,p.runLabel].filter(Boolean).join(" ／ "))}</div><h2>${esc(p.title||"卓記事")}</h2>${p.updatedAt?`<div class="small muted">更新 ${esc(p.updatedAt)}</div>`:""}</div><div class="share-article-blocks">${body}</div>`};
 const unlockArticle=p=>{
   if(!p.passwordRequired){renderArticle(p);return}
   box.innerHTML=`<div class="share-password"><h2>パスワード保護された卓記事です</h2><p class="small muted">共有者から案内されたパスワードを入力してください。</p><div class="share-password-row"><div><label>パスワード</label><input id="articleSharePassword" type="password" autocomplete="current-password"></div><button id="articleShareUnlock" type="button">開く</button></div><div id="articleShareError" class="share-password-error"></div></div>`;
   const input=document.getElementById("articleSharePassword"),btn=document.getElementById("articleShareUnlock"),err=document.getElementById("articleShareError");
   const check=async()=>{const hash=await sha256Text(input.value);if(hash===String(p.passwordHash||"")){renderArticle(p)}else{err.textContent="パスワードが違います。";input.select()}};btn.onclick=check;input.onkeydown=e=>{if(e.key==="Enter")check()};input.focus();
 };
 const reportHtml=p=>{const rows=Array.isArray(p.participantRows)?p.participantRows.slice():[];if(p.selfRole)rows.push({role:p.selfRole,ho:p.selfHo||"",plName:"自分",pcName:p.selfRole==="PL"?(p.selfPcName||""):""});return rows.length?`<div class="share-report-block"><strong>参加</strong>${rows.map(r=>`<div>${esc(r.ho?`${r.ho}：`:r.role?`${r.role}：`:"")}${esc(r.plName||"")}${r.pcName?` / ${esc(r.pcName)}`:""}</div>`).join("")}</div>`:""};
 const id=new URLSearchParams(location.search).get("id")||location.hash.replace(/^#/,"");if(!id){box.innerHTML="<p>共有IDがありません。</p>";return}
 try{
  const payload=await TRPG39Cloud.getSharedPage(id);if(!payload)throw new Error("共有データが見つかりません");const p=Array.isArray(payload)?{kind:"scenario-list",items:payload}:payload;
  if(p.kind==="library-article"){unlockArticle(p);return}
  if(p.kind==="library-session"){box.innerHTML=`<h2>${esc(p.title||"LIBRARY")}</h2><div class="share-meta">${p.system?`<span class="badge">${esc(p.system)}</span>`:""}${p.date?`<span class="badge">${esc(p.date)}</span>`:""}</div>${p.image?`<img src="${esc(p.image)}" alt="" style="max-width:420px;width:100%;border-radius:8px;border:1px solid var(--line);margin-bottom:10px">`:""}${reportHtml(p)}${p.comment?`<div class="share-report-block"><strong>ひとこと</strong><p style="white-space:pre-wrap">${esc(p.comment)}</p></div>`:""}${p.spoiler?`<details class="share-spoiler"><summary>⚠ ネタバレ</summary><div class="spoiler-body">${esc(p.spoiler)}</div></details>`:""}`;return}
  if(p.kind==="calendar-availability"){const days=p.days||[];box.innerHTML=`<h2>${esc(p.label||"空き日カレンダー")}</h2><div class="share-cal">${days.map(d=>`<div class="share-day"><div class="num">${esc(d.date)}</div><div class="${d.state==="free"?"free":"busy"}">${d.state==="free"?"○ 空き":"予定あり"}</div></div>`).join("")}</div>`;return}
  if(p.kind==="scenario-list"||p.kind==="scenarios"||Array.isArray(p.scenarios)||Array.isArray(p.items)){const items=Array.isArray(p.scenarios)?p.scenarios:(p.items||[]);box.innerHTML=`<h2>${esc(p.title||p.label||"SCENARIO")}</h2><div class="share-scenario-grid">${items.map(x=>`<article class="share-scenario-card">${x.thumbnailUrl||x.image||x.imageUrl?`<img class="share-scenario-thumb" src="${esc(x.thumbnailUrl||x.image||x.imageUrl)}" alt="">`:`<div class="share-scenario-placeholder">🌺</div>`}<div class="share-scenario-body"><div class="share-scenario-title">${esc(x.title||x.name||"名称未設定")}</div><div class="share-meta">${x.system?`<span class="badge">${esc(x.system)}</span>`:""}</div>${x.author?`<div class="small muted">${esc(x.author)}</div>`:""}${(x.tags||[]).length?`<div class="share-tags">${x.tags.map(t=>`<span class="badge">#${esc(t)}</span>`).join("")}</div>`:""}</div></article>`).join("")}</div>`;return}
  if(p.kind==="scenario"||p.scenario){const x=p.scenario||p;box.innerHTML=`<h2>${esc(x.title||x.name||"SCENARIO")}</h2>${x.thumbnailUrl||x.image||x.imageUrl?`<img src="${esc(x.thumbnailUrl||x.image||x.imageUrl)}" alt="" style="max-width:520px;width:100%;border-radius:8px;border:1px solid var(--line)">`:""}${x.author?`<p><strong>作者</strong> ${esc(x.author)}</p>`:""}${x.description||x.memo?`<p style="white-space:pre-wrap">${esc(x.description||x.memo)}</p>`:""}`;return}
  box.innerHTML="<p>この共有データ形式には対応していません。</p>";
 }catch(e){console.error(e);box.innerHTML=`<p>共有ページを読み込めませんでした。<br><span class="small">${esc(e.message||e)}</span></p>`}
})();
</script></body></html>
