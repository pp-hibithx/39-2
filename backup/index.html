<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BACKUP | 39*2</title><link rel="stylesheet" href="../assets/css/style.css"></head><body>
<header class="site-header"><div class="wrap"><h1 class="brand brand-392">39*2 <span class="hibiscus-logo" aria-hidden="true">🌺</span></h1><div class="tagline">TRPG Scenario &amp; Tools</div><nav class="nav"><a href="../">HOME</a><a href="../scenario/">SCENARIO</a><a href="../calendar/">CALENDAR</a><a href="../library/">LIBRARY</a><a href="../tools/">TOOLS</a><a href="../backup/" aria-current="page">BACKUP</a><a href="../about/">ABOUT</a></nav></div></header>
<main><div class="wrap"><div class="hero"><h2>BACKUP</h2><p>SCENARIOとLIBRARYに保存したデータを、 バックアップ・復元できます。</p></div><section class="panel"><p>ブラウザ内に保存されているSCENARIOとLIBRARYのデータを、 ひとつのバックアップファイルとして保存できます。</p><button id="export" class="primary">バックアップを書き出す</button> <button id="import">バックアップを復元</button><input id="file" type="file" accept=".json,application/json" hidden><p class="small" style="margin-top:12px"><a class="link" href="../bridge/">Life Archive連携用データを書き出す</a></p></section></div></main><footer class="footer"><div class="wrap">© <span data-year></span> 39*2</div></footer>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/migrate-v02.js"></script>
<script src="../assets/js/shared-data.js"></script>
<script>
(()=>{const q=id=>document.getElementById(id);
q("export").onclick=()=>{let payload={app:"39*2",schemaVersion:1,exportedAt:new Date().toISOString(),scenarios:TRPG39.loadScenarios(),events:TRPG39.loadEvents(),album:TRPG39.loadAlbum()},b=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="39x2-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
q("import").onclick=()=>q("file").click();
q("file").onchange=()=>{let f=q("file").files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.scenarios)||!Array.isArray(x.events)||!Array.isArray(x.album))throw 0;if(confirm("現在のSCENARIO・CALENDAR・LIBRARYをバックアップ内容で置き換えますか？")){TRPG39.saveScenarios(x.scenarios);TRPG39.saveEvents(x.events);TRPG39.saveAlbum(x.album);alert("復元しました。")}}catch{alert("39*2のバックアップを読み込めませんでした。")}};r.readAsText(f);q("file").value=""};
})();
</script>
</body></html>
