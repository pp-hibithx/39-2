(()=>{try{const k="trpg39_theme",v=localStorage.getItem(k)||"system",m=(v==="light"||v==="dark")?v:(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"),r=document.documentElement;r.setAttribute("data-theme",m);r.setAttribute("data-theme-mode",v);r.classList.remove("theme-light","theme-dark");r.classList.add(m==="light"?"theme-light":"theme-dark");r.style.colorScheme=m;}catch(e){}})();

<script defer src="../assets/js/theme-v0296.js"></script><style>
.prep-wrap{max-width:1180px;margin:auto;padding:24px 20px}

</head><body><main class="prep-wrap"><p><a href="../scenario/index.html?v=0292">← SCENARIO</a></p><h1>卓準備</h1><div id="scenarioTitle" class="small muted"></div>
<div class="prep-grid"><aside class="prep-panel"><h2>テンプレート</h2><button class="template-btn" data-template="kp">CoC KP基本セット</button><button class="template-btn" data-template="pl">CoC PL基本セット</button><h3>自作テンプレート</h3><div id="customTemplates"></div><button id="saveTemplate">現在の項目をテンプレート保存</button></aside>
<section class="prep-panel"><div class="prep-head"><div><label>準備の種類</label><select id="scope"><option value="scenario">シナリオ共通準備</option><option value="kpRun">陣ごとのKP準備</option><option value="plSession">卓ごとのPL準備</option></select></div><div><label>陣・卓名</label><input id="runLabel" placeholder="例：1陣目／自陣"></div></div><div id="progress" style="margin:12px 0"></div><div id="saveNote" class="small muted" style="margin:-6px 0 10px">変更内容は自動保存されます。</div><div id="items" class="prep-list"></div><hr><h3>項目を追加</h3><input id="newTitle" placeholder="例：キャラシ提出"><div class="prep-add"><input id="newDeadline" class="deadline" type="date"><input id="newUrl" type="url" placeholder="関連URL"><input id="newMemo" placeholder="メモ"><button id="addItem">追加</button></div></section></div></main>
<script src="../assets/js/shared-data.js?v=0292"></script><script>
(()=>{"use strict";const q=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY="39x2_prep_v1",TK="39x2_prep_templates_v1",UIKEY="39x2_prep_ui_v1",sid=new URLSearchParams(location.search).get("scenario")||"general";let all=(()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch{return {}}})();let custom=(()=>{try{return JSON.parse(localStorage.getItem(TK)||"[]")}catch{return []}})();let ui=(()=>{try{return JSON.parse(localStorage.getItem(UIKEY)||"{}")}catch{return {}}})();
const scenarios=TRPG39.loadScenarios(),sc=scenarios.find(x=>x.id===sid);q("scenarioTitle").textContent=sc?sc.title:"シナリオ未指定";
let activeLabel="_";
const defaults={kp:[["シナリオを読む","scenario"],["ココフォリア部屋作成","scenario"],["マップ・素材準備","scenario"],["BGM準備","scenario"],["PL確定","kpRun"],["HO配布","kpRun"],["PC・キャラシ確認","kpRun"],["日程確認","kpRun"]],pl:[["レギュレーション確認","plSession"],["KPハウスルール確認","plSession"],["HO確認","plSession"],["キャラクター作成","plSession"],["キャラシ提出","plSession"],["KP確認・修正対応","plSession"],["立ち絵・駒準備","plSession"],["日程・開始時刻確認","plSession"]]};
function saveUI(){ui[sid]={scope:q("scope").value,label:q("runLabel").value};localStorage.setItem(UIKEY,JSON.stringify(ui))}
function bucket(scopeOverride,labelOverride){const scope=scopeOverride||q("scope").value,label=(labelOverride??q("runLabel").value).trim()||"_";all[sid]??={};all[sid][scope]??={};all[sid][scope][label]??=[];return all[sid][scope][label]}
function chooseInitialView(){const params=new URLSearchParams(location.search),requestedScope=params.get("scope"),requestedLabel=params.get("label");if(requestedScope&&q("scope").querySelector(`option[value="${CSS.escape(requestedScope)}"]`)){q("scope").value=requestedScope;q("runLabel").value=requestedLabel&&requestedLabel!=="_"?requestedLabel:"";return}const saved=ui[sid]||{};if(saved.scope&&q("scope").querySelector(`option[value="${saved.scope}"]`))q("scope").value=saved.scope;if(typeof saved.label==="string")q("runLabel").value=saved.label;if(saved.scope)return;const data=all[sid]||{};for(const scope of ["plSession","kpRun","scenario"]){const labels=data[scope]||{};const key=Object.keys(labels).find(k=>Array.isArray(labels[k])&&labels[k].length);if(key){q("scope").value=scope;q("runLabel").value=key==="_"?"":key;break}}}
function normLabel(v){return String(v||"").trim()||"_"}
function commitRunLabel(){const scope=q("scope").value,from=activeLabel,to=normLabel(q("runLabel").value);if(from===to){saveUI();return}all[sid]??={};all[sid][scope]??={};const labels=all[sid][scope],source=Array.isArray(labels[from])?labels[from]:[],dest=Array.isArray(labels[to])?labels[to]:[];if(source.length&&to!=="_"&&!dest.length){labels[to]=source;delete labels[from]}activeLabel=to;localStorage.setItem(KEY,JSON.stringify(all));saveUI();render()}
function save(){localStorage.setItem(KEY,JSON.stringify(all));saveUI();render()}
function localDate(){const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function dateOnly(v){return String(v||"").split("T")[0]}
function persist(){localStorage.setItem(KEY,JSON.stringify(all))}
function makeItem(title,deadline="",url="",memo=""){return {id:crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random()+"",title:title.trim(),done:false,deadline:dateOnly(deadline),url,memo,completedAt:""}}
function add(title,deadline="",url="",memo=""){if(!title.trim())return;bucket().push(makeItem(title,deadline,url,memo));save()}
function applyTemplate(kind){const rows=kind==="custom"?[]:defaults[kind]||[],label=q("runLabel").value;let firstScope="";rows.forEach(([title,scope])=>{firstScope ||= scope;const xs=bucket(scope,label);if(!xs.some(x=>x.title===title))xs.push(makeItem(title));});persist();if(firstScope)q("scope").value=firstScope;saveUI();render()}
function render(){const xs=bucket(),done=xs.filter(x=>x.done).length;q("progress").innerHTML=`<b>準備 ${done}/${xs.length}</b>`;q("items").innerHTML=xs.length?xs.map(x=>{const deadline=dateOnly(x.deadline),completed=dateOnly(x.completedAt);return `<div class="prep-item ${x.done?"done":""}"><input type="checkbox" data-check="${x.id}" ${x.done?"checked":""}><div class="prep-item-body"><div class="prep-title"><b>${esc(x.title)}</b></div><div class="prep-meta">${deadline?`締切：${esc(deadline.replaceAll("-","/"))}`:""}${completed?`${deadline?" ／ ":""}完了：${esc(completed.replaceAll("-","/"))}`:""}${x.memo?`${deadline||completed?" ／ ":""}${esc(x.memo)}`:""}${x.url?` ／ <a href="${esc(x.url)}" target="_blank" rel="noopener">関連URL</a>`:""}</div><details class="prep-detail"><summary>締切日・URL・メモを編集</summary><div class="prep-detail-grid"><label>締切日<input type="date" data-edit-deadline="${x.id}" value="${esc(deadline)}"></label><label>関連URL<input type="url" data-edit-url="${x.id}" value="${esc(x.url||"")}" placeholder="https://..."></label><label class="wide">メモ<textarea data-edit-memo="${x.id}" placeholder="準備メモ">${esc(x.memo||"")}</textarea></label><div class="prep-detail-actions"><span class="prep-completed">${completed?`完了日：${esc(completed.replaceAll("-","/"))}`:"未完了"}</span><button type="button" data-save-detail="${x.id}">詳細を保存</button></div></div></details></div><button data-del="${x.id}">削除</button></div>`}).join(""):'<div class="small muted">まだ準備項目はありません。</div>';
document.querySelectorAll("[data-check]").forEach(c=>c.onchange=()=>{const x=xs.find(v=>v.id===c.dataset.check);x.done=c.checked;x.completedAt=c.checked?localDate():"";save()});
document.querySelectorAll("[data-save-detail]").forEach(b=>b.onclick=()=>{const id=b.dataset.saveDetail,x=xs.find(v=>v.id===id);if(!x)return;x.deadline=document.querySelector(`[data-edit-deadline="${CSS.escape(id)}"]`)?.value||"";x.url=document.querySelector(`[data-edit-url="${CSS.escape(id)}"]`)?.value.trim()||"";x.memo=document.querySelector(`[data-edit-memo="${CSS.escape(id)}"]`)?.value.trim()||"";save()});
document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const i=xs.findIndex(v=>v.id===b.dataset.del);xs.splice(i,1);save()});renderTemplates()}
function renderTemplates(){q("customTemplates").innerHTML=custom.map((t,i)=>`<button class="template-btn" data-custom="${i}">${esc(t.name)}</button>`).join("");document.querySelectorAll("[data-custom]").forEach(b=>b.onclick=()=>{const t=custom[Number(b.dataset.custom)];t.items.forEach(x=>add(x.title,x.deadline||"",x.url||"",x.memo||""))})}
q("addItem").onclick=()=>{add(q("newTitle").value,q("newDeadline").value,q("newUrl").value,q("newMemo").value);q("newTitle").value=q("newDeadline").value=q("newUrl").value=q("newMemo").value=""};document.querySelectorAll("[data-template]").forEach(b=>b.onclick=()=>applyTemplate(b.dataset.template));q("scope").onchange=()=>{activeLabel=normLabel(q("runLabel").value);saveUI();render()};q("runLabel").oninput=()=>saveUI();q("runLabel").onchange=commitRunLabel;q("runLabel").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();q("runLabel").blur()}};q("saveTemplate").onclick=()=>{const name=prompt("テンプレート名");if(!name)return;custom.push({name,items:bucket().map(({title,deadline,url,memo})=>({title,deadline,url,memo}))});localStorage.setItem(TK,JSON.stringify(custom));renderTemplates()};chooseInitialView();activeLabel=normLabel(q("runLabel").value);saveUI();render();
})();
</script></body></html>
