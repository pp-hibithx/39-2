<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PREP | SAKU+MERU</title><script>
(()=>{try{const k="trpg39_theme",v=localStorage.getItem(k)||"system",m=(v==="light"||v==="dark")?v:(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"),r=document.documentElement;r.setAttribute("data-theme",m);r.setAttribute("data-theme-mode",v);r.classList.remove("theme-light","theme-dark");r.classList.add(m==="light"?"theme-light":"theme-dark");r.style.colorScheme=m;}catch(e){}})();
</script>
<link rel="stylesheet" href="../assets/css/style-v0296.css">
<script defer src="../assets/js/theme-v0296.js"></script><style>
.prep-wrap{max-width:1180px;margin:auto;padding:24px 20px}
.prep-grid{display:grid;grid-template-columns:minmax(230px,280px) minmax(0,1fr);gap:20px;align-items:stretch}
.prep-panel{min-width:0;border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--panel);height:auto;box-sizing:border-box}
.prep-grid > .prep-panel{margin:0 !important;align-self:stretch}
.prep-list{display:grid;gap:9px}
.prep-item{min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:8px}
.prep-item.done .prep-title{text-decoration:line-through;opacity:.6}
.prep-meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.prep-actions{display:flex;gap:6px;flex-wrap:wrap}
.prep-actions button{padding:5px 8px}
.template-btn{width:100%;text-align:left;margin:4px 0}
.deadline{min-width:170px}
.prep-head{display:grid;grid-template-columns:minmax(220px,1fr) minmax(220px,1fr);gap:14px;align-items:end}
.prep-add{display:grid;grid-template-columns:minmax(170px,.8fr) minmax(180px,1fr) minmax(160px,1fr) auto;gap:8px;align-items:center;margin-top:7px}
.prep-add>*{min-width:0;max-width:100%;box-sizing:border-box}
.prep-panel input,.prep-panel select,.prep-panel textarea{max-width:100%;box-sizing:border-box}

html.theme-light .prep-panel,
html.theme-light .prep-item,
html[data-theme="light"] .prep-panel,
html[data-theme="light"] .prep-item{
  background:var(--panel);
  border-color:var(--line);
}
@media(max-width:820px){
 .prep-grid{grid-template-columns:1fr;align-items:start}
 .prep-panel{height:auto}
 .prep-head{grid-template-columns:1fr}
 .prep-add{grid-template-columns:1fr}
 .deadline{min-width:0}
}
</style></head><body><main class="prep-wrap"><p><a href="../scenario/index.html?v=0292">← SCENARIO</a></p><h1>卓準備</h1><div id="scenarioTitle" class="small muted"></div>
<div class="prep-grid"><aside class="prep-panel"><h2>テンプレート</h2><button class="template-btn" data-template="kp">CoC KP基本セット</button><button class="template-btn" data-template="pl">CoC PL基本セット</button><h3>自作テンプレート</h3><div id="customTemplates"></div><button id="saveTemplate">現在の項目をテンプレート保存</button></aside>
<section class="prep-panel"><div class="prep-head"><div><label>準備の種類</label><select id="scope"><option value="scenario">シナリオ共通準備</option><option value="kpRun">陣ごとのKP準備</option><option value="plSession">卓ごとのPL準備</option></select></div><div><label>陣・卓名</label><input id="runLabel" placeholder="例：1陣目／自陣"></div></div><div id="progress" style="margin:12px 0"></div><div id="items" class="prep-list"></div><hr><h3>項目を追加</h3><input id="newTitle" placeholder="例：キャラシ提出"><div class="prep-add"><input id="newDeadline" class="deadline" type="datetime-local"><input id="newUrl" type="url" placeholder="関連URL"><input id="newMemo" placeholder="メモ"><button id="addItem">追加</button></div></section></div></main>
<script src="../assets/js/shared-data.js?v=0292"></script><script>
(()=>{"use strict";const q=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY="39x2_prep_v1",TK="39x2_prep_templates_v1",sid=new URLSearchParams(location.search).get("scenario")||"general";let all=(()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch{return {}}})();let custom=(()=>{try{return JSON.parse(localStorage.getItem(TK)||"[]")}catch{return []}})();
const scenarios=TRPG39.loadScenarios(),sc=scenarios.find(x=>x.id===sid);q("scenarioTitle").textContent=sc?sc.title:"シナリオ未指定";
const defaults={kp:[["シナリオを読む","scenario"],["ココフォリア部屋作成","scenario"],["マップ・素材準備","scenario"],["BGM準備","scenario"],["PL確定","kpRun"],["HO配布","kpRun"],["PC・キャラシ確認","kpRun"],["日程確認","kpRun"]],pl:[["レギュレーション確認","plSession"],["KPハウスルール確認","plSession"],["HO確認","plSession"],["キャラクター作成","plSession"],["キャラシ提出","plSession"],["KP確認・修正対応","plSession"],["立ち絵・駒準備","plSession"],["日程・開始時刻確認","plSession"]]};
function bucket(){const scope=q("scope").value,label=q("runLabel").value.trim()||"_";all[sid]??={};all[sid][scope]??={};all[sid][scope][label]??=[];return all[sid][scope][label]}
function save(){localStorage.setItem(KEY,JSON.stringify(all));render()}
function add(title,deadline="",url="",memo=""){if(!title.trim())return;bucket().push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+"",title:title.trim(),done:false,deadline,url,memo});save()}
function applyTemplate(kind){const rows=kind==="custom"?[]:defaults[kind]||[];rows.forEach(([title,scope])=>{q("scope").value=scope;add(title)});render()}
function render(){const xs=bucket(),done=xs.filter(x=>x.done).length;q("progress").innerHTML=`<b>準備 ${done}/${xs.length}</b>`;q("items").innerHTML=xs.length?xs.map(x=>`<div class="prep-item ${x.done?"done":""}"><input type="checkbox" data-check="${x.id}" ${x.done?"checked":""}><div><div class="prep-title"><b>${esc(x.title)}</b></div><div class="prep-meta">${x.deadline?`期限：${esc(x.deadline.replace("T"," "))}`:""}${x.memo?` ／ ${esc(x.memo)}`:""}${x.url?` ／ <a href="${esc(x.url)}" target="_blank" rel="noopener">関連URL</a>`:""}</div></div><button data-del="${x.id}">削除</button></div>`).join(""):'<div class="small muted">まだ準備項目はありません。</div>';document.querySelectorAll("[data-check]").forEach(c=>c.onchange=()=>{const x=xs.find(v=>v.id===c.dataset.check);x.done=c.checked;save()});document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const i=xs.findIndex(v=>v.id===b.dataset.del);xs.splice(i,1);save()});renderTemplates()}
function renderTemplates(){q("customTemplates").innerHTML=custom.map((t,i)=>`<button class="template-btn" data-custom="${i}">${esc(t.name)}</button>`).join("");document.querySelectorAll("[data-custom]").forEach(b=>b.onclick=()=>{const t=custom[Number(b.dataset.custom)];t.items.forEach(x=>add(x.title,x.deadline||"",x.url||"",x.memo||""))})}
q("addItem").onclick=()=>{add(q("newTitle").value,q("newDeadline").value,q("newUrl").value,q("newMemo").value);q("newTitle").value=q("newDeadline").value=q("newUrl").value=q("newMemo").value=""};document.querySelectorAll("[data-template]").forEach(b=>b.onclick=()=>applyTemplate(b.dataset.template));q("scope").onchange=render;q("runLabel").oninput=render;q("saveTemplate").onclick=()=>{const name=prompt("テンプレート名");if(!name)return;custom.push({name,items:bucket().map(({title,deadline,url,memo})=>({title,deadline,url,memo}))});localStorage.setItem(TK,JSON.stringify(custom));renderTemplates()};render();
})();
</script></body></html>
