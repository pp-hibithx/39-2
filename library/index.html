<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIBRARY | 39*2</title>
<link rel="stylesheet" href="../assets/css/style.css?v=0224">
<style>
.album-grid{display:grid;grid-template-columns:1fr;gap:28px;align-items:start}
.album-panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px}
.album-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.album-list{display:grid;gap:12px;margin-top:10px}
.album-card{border:1px solid var(--line);border-radius:11px;overflow:hidden}.album-cover{min-height:74px;padding:15px;background:rgba(255,255,255,.025)}
.album-body{padding:12px}.album-meta{display:flex;gap:5px;flex-wrap:wrap}.album-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.spoiler{margin-top:9px;border:1px solid var(--line);border-radius:8px;overflow:hidden}.spoiler summary{cursor:pointer;padding:8px 10px;font-weight:700}.spoiler-body{padding:0 10px 10px;white-space:pre-wrap}
textarea{width:100%;min-height:76px}input,select{width:100%}label{display:block;margin:7px 0 3px}
@media(max-width:850px){.album-row{grid-template-columns:1fr}}
.image-preview{margin-top:8px;display:flex;align-items:flex-start;gap:10px}.image-preview[hidden]{display:none}.image-preview img{width:150px;aspect-ratio:16/10;object-fit:cover;border:1px solid var(--line);border-radius:8px}.library-editor{border-top:1px solid var(--line);padding-top:22px}
</style>

<style>
.library-page{display:grid;gap:14px}
.lib-panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.lib-toolbar{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:8px;align-items:end}
.lib-list{display:grid;gap:9px;margin-top:10px}
.lib-group{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:rgba(255,255,255,.012)}
.lib-group[open]{background:rgba(255,255,255,.018)}
.lib-group-summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center}
.lib-group-summary::-webkit-details-marker{display:none}
.lib-parent-thumb{width:72px;aspect-ratio:16/10;object-fit:cover;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.025)}
.lib-parent-placeholder{display:grid;place-items:center}
.lib-parent-title{font-size:14px;font-weight:700;margin-bottom:4px}
.lib-parent-meta{display:flex;gap:5px;flex-wrap:wrap}
.lib-count{font-size:12px;color:var(--muted);white-space:nowrap}
.lib-children{border-top:1px solid var(--line);padding:7px 10px 10px}
.lib-child{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.06)}
.lib-child:last-child{border-bottom:0}
.lib-child-date{font-size:12px;color:var(--muted);padding-top:2px}
.lib-child-title{font-size:13px;font-weight:650}
.lib-child-meta{font-size:12px;color:var(--muted);margin-top:2px}
.lib-child-note{font-size:12px;margin-top:5px;white-space:pre-wrap}
.lib-child-actions{display:flex;gap:6px;align-items:center}
.lib-child-actions button,.lib-parent-actions button,.lib-parent-actions a{font-size:12px}
.lib-parent-actions{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0 2px}
.library-editor{border-top:1px solid var(--line);padding-top:14px}
.lib-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.image-preview{margin-top:8px;display:flex;align-items:flex-start;gap:10px}.image-preview[hidden]{display:none}
.image-preview img{width:150px;aspect-ratio:16/10;object-fit:cover;border:1px solid var(--line);border-radius:8px}
.ext-row{padding:8px;margin:6px 0}
textarea{width:100%;min-height:76px}input,select{width:100%}label{display:block;margin:6px 0 3px}
@media(max-width:760px){
  .lib-toolbar{grid-template-columns:1fr}
  .lib-group-summary{grid-template-columns:58px minmax(0,1fr)}
  .lib-parent-thumb{width:58px}
  .lib-count{grid-column:2}
  .lib-child{grid-template-columns:76px minmax(0,1fr)}
  .lib-child-actions{grid-column:2}
  .lib-form-grid{grid-template-columns:1fr}
}
</style>

<script src="../assets/js/theme.js?v=0224"></script>
</head>
<body>
<header class="site-header"><div class="wrap">
<h1 class="brand brand-392">39*2 <span class="hibiscus-logo" aria-hidden="true">🌺</span></h1>
<div class="tagline">TRPG Scenario &amp; Tools</div>
<nav class="nav"><a href="../">HOME</a><a href="../scenario/">SCENARIO</a><a href="../calendar/">CALENDAR</a><a href="./" aria-current="page">LIBRARY</a><a href="../pcs/">PC</a><a href="../players/">PLAYERS</a><a href="../tools/">TOOLS</a><a href="../backup/">BACKUP</a><a href="../about/">ABOUT</a></nav><div class="theme-switcher" aria-label="テーマ">
<button type="button" data-theme-choice="system">端末</button>
<span>·</span>
<button type="button" data-theme-choice="dark">ダーク</button>
<span>·</span>
<button type="button" data-theme-choice="light">ライト</button>
</div>
</div></header>

<main><div class="wrap library-page">
<div class="hero"><h2>LIBRARY</h2><p>遊んだ記録をシナリオごとにまとめて残せます。</p></div>
<div class="notice small">記録はお使いのブラウザ内に保存されます。<br>現在他の利用者とのオンライン共有には対応していません。</div>

<section class="lib-panel">
  <div class="row">
    <div><h2>TRPG ALBUM</h2><div id="summary" class="small"></div></div>
    <button id="openLibraryEditor" type="button">＋ 記録を追加</button>
  </div>
  <div class="lib-toolbar">
    <div><label>検索</label><input id="search" type="search" placeholder="シナリオ・PC・友達"></div>
    <div><label>役割</label><select id="filter"><option value="">すべて</option><option>PL</option><option>KP</option><option>SKP</option><option>その他</option></select></div>
    <div></div>
  </div>
  <div id="list" class="lib-list"></div>
</section>

<section class="lib-panel library-editor" id="libraryEditor" hidden>
  <h2 id="formHeading">開催記録を追加</h2>
  <input id="editId" type="hidden">

  <label>シナリオ</label>
  <select id="scenarioSelect"><option value="">直接入力</option></select>
  <label>シナリオ名</label><input id="title">

  <div class="lib-form-grid">
    <div><label>遊んだ日</label><input id="date" type="date"></div>
    <div><label>システム</label><input id="system" placeholder="CoC6版 など"></div>
  </div>
  <div class="lib-form-grid">
    <div><label>自分の役割</label><select id="role"><option>PL</option><option>KP</option><option>SKP</option><option>その他</option></select></div>
    <div><label>PC</label><select id="pcSelect"><option value="">直接入力</option></select><input id="pc" placeholder="未登録PCは保存時にPC LIBRARYへ自動登録"></div>
  </div>

  <label>一緒に遊んだ人</label><input id="people" placeholder="名前をカンマ区切り">
  <label>スクリーンショット</label>
<div class="lib-form-grid">
  <div><input id="image" type="url" placeholder="画像URLを貼る"></div>
  <div><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><button id="uploadImage" type="button">画像をアップロード</button></div>
</div>
<p class="small muted">URL貼り付けと直接アップロードの両方に対応します。直接アップロードは公開・リンク共有向けです。</p>
  <div id="imagePreview" class="image-preview" hidden><img id="imagePreviewImg" alt="スクリーンショットのプレビュー"><div class="small muted">画像URLを貼ると、保存前にここで確認できます。</div></div>

  <label>外部リンク</label>
  <div id="externalLinks"></div>
  <button id="addExternalLink" type="button">＋ 外部リンクを追加</button>

  <label>公開範囲</label>
  <select id="visibility"><option value="private">自分のみ</option><option value="link">リンク限定</option><option value="public">公開</option><option value="table">同卓者のみ（準備中）</option></select>

  <label>ひとこと</label><textarea id="comment" placeholder="楽しかった！ など、ネタバレなしの思い出"></textarea>
  <label>⚠ ネタバレ枠</label><textarea id="spoiler" placeholder="シナリオ内容に触れる感想はこちら"></textarea><label>ネタバレ部分の公開範囲</label><select id="spoilerVisibility"><option value="private">自分のみ</option><option value="link">共有リンクに含める</option></select>

  <div class="album-actions"><button id="save" type="button">保存</button><button id="cancel" type="button" hidden>編集をやめる</button></div>
</section>
</div></main>

<footer class="footer"><div class="wrap">© <span data-year></span> 39*2</div></footer>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/migrate-v02.js"></script>
<script src="../assets/js/shared-data.js"></script>
<script src="../assets/js/supabase-config.js?v=0210"></script>
<script src="../assets/js/supabase-sync.js?v=0210"></script>
<script>TRPG39Sync.initAutoSync();</script>
<script src="../assets/js/supabase-share.js"></script>
<script>
(()=>{"use strict";
const q=id=>document.getElementById(id);
const vis={private:"自分のみ",table:"同卓者のみ（準備中）",link:"リンク限定",public:"公開"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const normTitle=s=>String(s||"").normalize("NFKC").replace(/\s+/g,"").toLowerCase();

let scenarios=TRPG39.loadScenarios();
let data=TRPG39.loadAlbum();

function migrateScenarioLinks(){
  let changed=false;
  const byTitle=new Map(scenarios.map(s=>[normTitle(s.title),s]));
  data=data.map(x=>{
    if(x.scenarioId)return x;
    const s=byTitle.get(normTitle(x.title));
    if(!s)return x;
    changed=true;
    return TRPG39.normalizeAlbum({...x,scenarioId:s.id,title:s.title,system:x.system||s.system});
  });
  if(changed)TRPG39.saveAlbum(data);
}
migrateScenarioLinks();

const persist=()=>TRPG39.saveAlbum(data);
const showEditor=()=>q("libraryEditor").hidden=false;
const hideEditor=()=>q("libraryEditor").hidden=true;

function fillPCSelect(selectedId=""){
 const pcs=TRPG39.loadPCs?TRPG39.loadPCs():[];
 q("pcSelect").innerHTML='<option value="">直接入力</option>'+pcs.slice().sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"ja")).map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
 q("pcSelect").value=selectedId||"";
}
function fillScenarioSelect(){
  scenarios=TRPG39.loadScenarios();
  q("scenarioSelect").innerHTML='<option value="">直接入力</option>'+scenarios
    .slice().sort((a,b)=>String(a.title).localeCompare(String(b.title),"ja"))
    .map(s=>`<option value="${esc(s.id)}">${esc(s.title)}</option>`).join("");
}
function scenarioById(id){return scenarios.find(s=>s.id===id)}
function addLinkRow(v={label:"",url:"",spoiler:false}){
 const wrap=document.createElement("div");wrap.className="card ext-row";
 wrap.innerHTML=`<div class="lib-form-grid"><div><label>表示名</label><input class="extLabel" value="${esc(v.label)}" placeholder="ふせったー感想 など"></div><div><label>URL</label><input class="extUrl" type="url" value="${esc(v.url)}" placeholder="https://..."></div></div><label class="checkline"><input class="extSpoiler" type="checkbox" ${v.spoiler?"checked":""}> ネタバレあり</label><button class="danger extRemove" type="button">削除</button>`;
 wrap.querySelector(".extRemove").onclick=()=>wrap.remove();q("externalLinks").appendChild(wrap);
}
function getLinks(){return [...document.querySelectorAll(".ext-row")].map(r=>({label:r.querySelector(".extLabel").value.trim(),url:r.querySelector(".extUrl").value.trim(),spoiler:r.querySelector(".extSpoiler").checked})).filter(x=>x.url)}
function updateImagePreview(){const u=q("image").value.trim();q("imagePreview").hidden=!u;q("imagePreviewImg").src=u||""}
function reset(prefillScenarioId=""){
 q("editId").value="";
 ["title","date","system","pc","people","image","comment","spoiler"].forEach(x=>q(x).value="");
 q("role").value="PL";q("visibility").value="private";q("spoilerVisibility").value="private";q("formHeading").textContent="開催記録を追加";q("cancel").hidden=true;
 q("externalLinks").innerHTML="";addLinkRow();updateImagePreview();fillScenarioSelect();fillPCSelect();
 q("scenarioSelect").value=prefillScenarioId||"";
 if(prefillScenarioId){
   const s=scenarioById(prefillScenarioId);
   if(s){q("title").value=s.title||"";q("system").value=s.system||""}
 }
}

async function uploadLibraryImage(){
  const file=q("imageFile")?.files?.[0];
  if(!file)return alert("画像ファイルを選んでください。");
  const cfg=window.SUPABASE_CONFIG||{};
  const base=String(cfg.projectUrl||"").trim();
  const key=String(cfg.publishableKey||"").trim();
  if(!base||!key)return alert("Supabase設定がありません。");
  const syncId=window.TRPG39Sync?.getSyncId?.()||localStorage.getItem("39x2_cloud_sync_id_v1")||"";
  if(!syncId)return alert("同期コードが見つかりません。先にBACKUPでクラウド同期を設定してください。");
  const fd=new FormData(); fd.append("file",file); fd.append("sync_id",syncId);
  const r=await fetch(base.replace(/\/$/,"")+"/functions/v1/image-upload",{method:"POST",headers:{apikey:key},body:fd});
  const body=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(body.error||("アップロードエラー "+r.status));
  q("image").value=body.publicUrl||""; updateImagePreview(); q("imageFile").value=""; return body.publicUrl;
}
function save(){
 let title=q("title").value.trim();if(!title)return alert("シナリオ名を入力してください。");
 let scenarioId=q("scenarioSelect").value;
 const selected=scenarioById(scenarioId);
 if(selected)title=selected.title;
 else if(title){
   const created=TRPG39.ensureScenario?TRPG39.ensureScenario(title,{system:q("system").value.trim()}):null;
   if(created){scenarioId=created.id;title=created.title;fillScenarioSelect();q("scenarioSelect").value=created.id;}
 }
 let id=q("editId").value||TRPG39.uuid(),old=data.find(x=>x.id===id);
 let item=TRPG39.normalizeAlbum({...old,id,scenarioId,title,date:q("date").value,system:q("system").value.trim(),role:q("role").value,pcName:q("pc").value.trim(),pcId:(()=>{const sid=q("pcSelect").value;if(sid)return sid;const typed=q("pc").value.trim();if(!typed)return "";const pc=TRPG39.ensurePC?TRPG39.ensurePC(typed,{system:q("system").value.trim()}):null;return pc?.id||""})(),participants:q("people").value.split(",").map(x=>x.trim()).filter(Boolean),imageUrls:q("image").value.trim()?[q("image").value.trim()]:[],visibility:q("visibility").value,comment:q("comment").value.trim(),spoiler:q("spoiler").value.trim(),spoilerVisibility:q("spoilerVisibility").value,externalLinks:getLinks()});
 let i=data.findIndex(x=>x.id===id);if(i>=0)data[i]=item;else data.unshift(item);
 persist();reset();render();hideEditor();
}
function edit(id){
 let x=data.find(v=>v.id===id);if(!x)return;fillScenarioSelect();
 q("editId").value=x.id;q("scenarioSelect").value=x.scenarioId||"";q("title").value=x.title||"";q("date").value=x.date||"";q("system").value=x.system||"";q("role").value=x.role||"PL";q("pc").value=x.pcName||"";fillPCSelect(x.pcId||"");q("people").value=(x.participants||[]).join(", ");q("image").value=(x.imageUrls||[])[0]||"";updateImagePreview();q("visibility").value=x.visibility||"private";q("comment").value=x.comment||"";q("spoiler").value=x.spoiler||"";q("spoilerVisibility").value=x.spoilerVisibility||"private";
 q("externalLinks").innerHTML="";(x.externalLinks||[]).forEach(addLinkRow);if(!(x.externalLinks||[]).length)addLinkRow();
 q("formHeading").textContent="開催記録を編集";q("cancel").hidden=false;showEditor();q("libraryEditor").scrollIntoView({behavior:"smooth",block:"start"});
}
function del(id){if(confirm("この開催記録を削除しますか？")){data=data.filter(x=>x.id!==id);persist();render()}}

function groupKey(x){return x.scenarioId?`id:${x.scenarioId}`:`title:${normTitle(x.title)}`}
function groupData(xs){
 const map=new Map();
 for(const x of xs){
   const key=groupKey(x);
   if(!map.has(key))map.set(key,{key,scenarioId:x.scenarioId||"",title:x.title||"名称未設定",items:[]});
   map.get(key).items.push(x);
 }
 return [...map.values()].map(g=>{
   g.items.sort((a,b)=>String(a.date||"9999").localeCompare(String(b.date||"9999")));
   const s=scenarioById(g.scenarioId);
   if(s){g.title=s.title||g.title;g.system=s.system||"";g.thumbnailUrl=s.thumbnailUrl||""}
   else{
     g.system=g.items.find(x=>x.system)?.system||"";
     g.thumbnailUrl=(g.items.find(x=>(x.imageUrls||[])[0])?.imageUrls||[])[0]||"";
   }
   g.people=[...new Set(g.items.flatMap(x=>x.participants||[]))];
   g.pcs=[...new Set(g.items.map(x=>x.pcName).filter(Boolean))];
   g.roles=[...new Set(g.items.map(x=>x.role).filter(Boolean))];
   g.firstDate=g.items.map(x=>x.date).filter(Boolean).sort()[0]||"";
   g.lastDate=g.items.map(x=>x.date).filter(Boolean).sort().slice(-1)[0]||"";
   return g;
 }).sort((a,b)=>String(b.lastDate||"").localeCompare(String(a.lastDate||""))||a.title.localeCompare(b.title,"ja"));
}
function dateRange(g){
 if(!g.firstDate)return "";
 return g.firstDate===g.lastDate?g.firstDate:`${g.firstDate} → ${g.lastDate}`;
}
function linksHtml(x){return (x.externalLinks||[]).length?`<div style="margin-top:5px">${x.externalLinks.map(l=>l.spoiler?`<details class="spoiler"><summary>⚠ ${esc(l.label||"ネタバレリンク")}</summary><div class="spoiler-body"><a class="link" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">開く</a></div></details>`:`<a class="link" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label||"外部リンク")}</a>`).join("　")}</div>`:""}

function showShareUrl(url,message){
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(url).then(()=>prompt(message+"\\n\\nコピー済みです。",url)).catch(()=>prompt(message,url))}
 else prompt(message,url);
}
async function shareAlbum(id){
 const x=data.find(v=>v.id===id);if(!x)return;
 if((x.visibility||"private")==="private"){
   alert("この記録は「自分のみ」です。共有するには公開範囲を「リンク限定」または「公開」に変更してください。");
   return;
 }
 if(x.visibility==="table"){
   alert("「同卓者のみ」は今後のアカウント共有用です。現在はリンク限定を使ってください。");
   return;
 }
 const payload={kind:"library-session",version:1,title:x.title,date:x.date,system:x.system,role:x.role,pcName:x.pcName,participants:x.participants||[],image:(x.imageUrls||[])[0]||"",comment:x.comment||"",spoiler:x.spoilerVisibility==="link"?(x.spoiler||""):"",externalLinks:x.externalLinks||[],visibility:x.visibility||"link"};
 try{
   if(TRPG39Cloud&&TRPG39Cloud.configured()){
     const shareId=await TRPG39Cloud.createSharedPage(payload);
     const url=new URL("../share/index.html",location.href);url.searchParams.set("id",shareId);
     showShareUrl(url.href,"この開催記録の共有URLを作成しました。");
     return;
   }
 }catch(e){console.error(e);alert("共有URLを作成できませんでした: "+(e.message||e));}
}
function addForScenario(id){
 reset(id);showEditor();q("libraryEditor").scrollIntoView({behavior:"smooth",block:"start"});
}
function render(){
 const term=q("search").value.trim().toLowerCase(),role=q("filter").value;
 let xs=data.filter(x=>(!role||x.role===role)&&(!term||[x.title,x.system,x.pcName,(x.participants||[]).join(" ")].join(" ").toLowerCase().includes(term)));
 const groups=groupData(xs);
 q("summary").textContent=`シナリオ ${groups.length}件 ／ 開催記録 ${xs.length}件`;
 q("list").innerHTML=groups.length?groups.map(g=>`<details class="lib-group" ${new URLSearchParams(location.search).get("scenario")===g.scenarioId?"open":""}>
   <summary class="lib-group-summary">
     ${g.thumbnailUrl?`<img class="lib-parent-thumb" src="${esc(g.thumbnailUrl)}" alt="" loading="lazy">`:`<div class="lib-parent-thumb lib-parent-placeholder">🌺</div>`}
     <div><div class="lib-parent-title">${esc(g.title)}</div><div class="lib-parent-meta">${g.system?`<span class="badge">${esc(g.system)}</span>`:""}${g.roles.map(r=>`<span class="badge">${esc(r)}</span>`).join("")}${dateRange(g)?`<span class="badge">${esc(dateRange(g))}</span>`:""}</div></div>
     <div class="lib-count">${g.items.length}回</div>
   </summary>
   <div class="lib-children">
     <div class="lib-parent-actions">${g.scenarioId?`<a class="link" href="../scenario/?focus=${encodeURIComponent(g.scenarioId)}">SCENARIOを見る</a>`:""}<button type="button" data-add-scenario="${esc(g.scenarioId)}" data-add-title="${esc(g.title)}">＋ 開催記録</button></div>
     ${g.items.map((x,i)=>`<article class="lib-child">
       <div class="lib-child-date">${esc(x.date||`記録 ${i+1}`)}</div>
       <div>
         <div class="lib-child-title">${esc(x.pcName?`PC：${x.pcName}`:(x.role||"開催記録"))}</div>
         <div class="lib-child-meta">${x.role?esc(x.role):""}${(x.participants||[]).length?`　参加：${esc(x.participants.join(" / "))}`:""}　${esc(vis[x.visibility]||"自分のみ")}</div>
         ${x.comment?`<div class="lib-child-note">${esc(x.comment)}</div>`:""}${linksHtml(x)}
         ${x.spoiler?`<details class="spoiler"><summary>⚠ ネタバレ</summary><div class="spoiler-body">${esc(x.spoiler)}</div></details>`:""}
       </div>
       <div class="lib-child-actions"><button data-share="${x.id}">共有</button><button data-edit="${x.id}">編集</button><button class="danger" data-del="${x.id}">削除</button></div>
     </article>`).join("")}
   </div>
 </details>`).join(""):'<div class="empty">まだ記録がありません。</div>';

 document.querySelectorAll("[data-add-scenario]").forEach(b=>b.onclick=e=>{
   e.preventDefault();e.stopPropagation();
   const id=b.dataset.addScenario;
   reset(id);
   if(!id)q("title").value=b.dataset.addTitle||"";
   showEditor();q("libraryEditor").scrollIntoView({behavior:"smooth",block:"start"});
 });
 document.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>shareAlbum(b.dataset.share));
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>edit(b.dataset.edit));
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>del(b.dataset.del));
}
q("pcSelect").onchange=()=>{const id=q("pcSelect").value;if(!id)return;const pc=(TRPG39.loadPCs?TRPG39.loadPCs():[]).find(p=>p.id===id);if(pc)q("pc").value=pc.name||""};
q("scenarioSelect").onchange=()=>{
 const s=scenarioById(q("scenarioSelect").value);
 if(s){q("title").value=s.title||"";q("system").value=s.system||""}
};
q("uploadImage").onclick=async()=>{try{q("uploadImage").disabled=true;q("uploadImage").textContent="アップロード中…";await uploadLibraryImage()}catch(e){console.error(e);alert(e.message||e)}finally{q("uploadImage").disabled=false;q("uploadImage").textContent="画像をアップロード"}};
q("save").onclick=save;
q("cancel").onclick=()=>{reset();hideEditor()};
q("image").oninput=updateImagePreview;
q("openLibraryEditor").onclick=()=>{reset();showEditor();q("libraryEditor").scrollIntoView({behavior:"smooth",block:"start"})};
q("search").oninput=render;q("filter").onchange=render;q("addExternalLink").onclick=()=>addLinkRow();
reset();hideEditor();render();
})();
</script>

</body></html>
